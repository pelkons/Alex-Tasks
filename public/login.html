<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>Alex Tasks · כניסה</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body class="login-body">
<main class="login-card">
  <img class="logo" src="/assets/logo-64.png?v=2" width="64" height="64" alt="" aria-hidden="true">
  <h1 dir="ltr">Alex Tasks</h1>
  <p class="muted">הזינו סיסמה כדי להיכנס</p>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="owner" autocomplete="username" hidden>
    <label class="field">
      <span>סיסמה</span>
      <input id="pw" type="password" name="password" autocomplete="current-password" required autofocus>
    </label>
    <p id="err" class="error" role="alert" hidden></p>
    <button class="btn primary big" id="go" type="submit">כניסה</button>
  </form>
</main>
<script>
// back to the page that was asked for (a notification's link): only a path on this site
const next = (() => { const n = new URLSearchParams(location.search).get('next') || '/'; return /^\/(?![\/\\])[\w\-/]*$/.test(n) ? n : '/'; })();
const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.hidden = true; go.disabled = true; go.textContent = 'נכנסים…';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { location.replace(next); return; }
    err.textContent = d.error || 'אירעה שגיאה. נסו שוב';
  } catch (x) { err.textContent = 'אין חיבור לשרת. נסו שוב'; }
  err.hidden = false; go.disabled = false; go.textContent = 'כניסה';
});
</script>
</body>
</html>
