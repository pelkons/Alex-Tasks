              <template x-for="g in pjGroups()" :key="g.topic">
                <div class="fg" :class="{closed: pjClosed(g.topic)}">
                  <button type="button" class="fg-h" @click="pjToggleGroup(g.topic)" :aria-expanded="!pjClosed(g.topic)">
                    <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                    <b x-text="g.label"></b><span class="pj-count" x-text="g.items.length"></span>
                  </button>
                  <ul class="fl" x-show="!pjClosed(g.topic)">
                    <template x-for="f in pjShown(g)" :key="(f.superseded_by ? 'h' : 'c')+f.id">
                      <li class="fr" :class="{old: f.superseded_by}">
                        <button type="button" class="fr-main" @click="openFact(f)" :title="'היסטוריה ועדכון: '+f.key">
                          <span class="fr-k" x-text="f.key"></span>
                          <span class="fr-v" x-text="f.value + (f.unit ? ' ' + f.unit : '') + (f.superseded_by ? ' (הוחלף)' : '')"></span>
                        </button>
                        <span class="kv-meta">
                          <span x-text="fmtDate(f.as_of_date)"></span>

        </div>

    </template>

</div>

                <input type="checkbox" class="tgl" :checked="obSet.enabled" @change="obToggle()" data-test="set-outbox"></label>
              <div class="set-row"><span class="set-l"><b>מגבלה יומית</b><small x-text="'נשלחו היום '+obSet.sent_today"></small></span>
                <input type="number" class="set-num" min="1" max="500" x-model.number="obSet.daily_cap" @change="obSetCap()" aria-label="מגבלה יומית"></div>
              <div class="set-row"><span class="set-l"><b>כתובת שולח</b></span><span class="set-val"><span dir="auto" x-text="obSet.from || 'לא הוגדרה'"></span><small x-text="obSet.signature_set ? 'חתימה מוגדרת' : 'ללא חתימה'"></small></span></div>
            </div>
          </template>
          <h3 class="set-h">כתובות מורשות</h3>
          <div class="set-group">
            <div class="set-row set-col"><textarea x-model="allowText" rows="3" dir="ltr" aria-label="כתובות מורשות"></textarea>
              <div class="set-foot"><small class="muted">מיילים מהכתובות האלה, או מועברים מהן, נקלטים. כתובת בכל שורה.</small><button class="btn small primary" @click="saveSet({email_allowlist: allowText})">שמירה</button></div></div>
          </div>
          <h3 class="set-h">סינון מיילים</h3>
          <div class="set-group filters-card">
            <template x-for="f in mailFilters" :key="f.id">
              <div class="set-row frule" :class="{off: !f.enabled}">
                <span class="set-l fr-l"><span><span class="fk" x-text="{sender:'שולח', domain:'דומיין', text:'טקסט', regex:'ביטוי'}[f.kind]"></span> <b dir="auto" x-text="f.pattern"></b></span>
                  <small><span class="fa" x-text="f.action_he"></span><span x-show="f.project" x-text="' · '+f.project"></span><span x-text="' · '+f.hits+' פגיעות'"></span></small></span>
                <input type="checkbox" class="tgl" :checked="f.enabled" @change="toggleFilter(f)" :aria-label="f.enabled ? 'השבתת הכלל' : 'הפעלת הכלל'">
                <button class="icon-btn" @click="deleteFilter(f)" aria-label="מחיקת כלל" title="מחיקה">✕</button>
              </div>
            </template>
            <div class="set-row" x-show="mailFilters.length===0"><span class="set-l"><small>אין כללים עדיין</small></span></div>
            <form class="set-row set-col fform" @submit.prevent="addFilter()">
              <div class="fform-g">
                <select x-model="fform.kind" aria-label="סוג כלל"><option value="sender">כתובת שולח</option><option value="domain">דומיין השולח</option><option value="text">מכיל טקסט</option><option value="regex">ביטוי רגולרי (מתקדם)</option></select>
                <input type="text" x-model="fform.pattern" :placeholder="{sender:'name@example.com', domain:'example.com', text:'למשל: Out of office', regex:'^(RE|FW):'}[fform.kind]" dir="auto" aria-label="תבנית">
                <select x-model="fform.action" aria-label="פעולה"><option value="skip">לדלג (רק לשמור)</option><option value="fyi">לידיעה בלבד</option><option value="relevant">תמיד רלוונטי</option></select>
                <select x-model="fform.project" aria-label="היקף פרויקט"><option value="">כל הפרויקטים</option><template x-for="p in boot.projects.filter(p=>!p.is_default)" :key="p.id"><option :value="p.id" x-text="p.name_he"></option></template></select>
              </div>
              <div class="set-foot"><button type="button" class="btn small" @click="previewFilter()">בדוק את הכלל</button><button type="submit" class="btn small primary" :disabled="!fform.pattern.trim()">הוספת כלל</button></div>
              <small x-show="fprev" x-text="fprev ? 'הכלל היה תופס '+fprev.matches+' מתוך '+fprev.total+' המיילים של '+fprev.days+' הימים האחרונים'+(fprev.examples.length ? ': '+fprev.examples.map(e=>e.subject).join(' · ') : '') : ''"></small>
            </form>
            <details class="set-row set-col set-more"><summary>פרטים</summary>
              <p>הכללים פועלים לפני שמודל רואה את המייל, בייבוא היומי ובדואר השוטף. "לדלג": המייל נשמר וניתן לחיפוש אבל לא מעובד. "לידיעה": רק עובדות, בלי משימות. "תמיד רלוונטי": לעולם לא מסוננים. אפשר גם בצ׳אט: "תסנן מיילים מ-X".</p></details>
          </div>
          <h3 class="set-h">ייבוא יומי ידני</h3>
          <div class="set-group">
            <details class="set-row set-col set-more"><summary>איך לייצא מיילים מ-Outlook</summary>
              <p>כל בוקר אפשר להעביר לאלכס את כל המיילים של אתמול, גם שהתקבלו וגם שנשלחו. אלכס מסנן כפילויות ורעש, מקבץ לשרשורים, פותח וסוגר משימות, ושולח סיכום אחד כשהוא מסיים.</p>
              <p><b>הדרך המומלצת: העברה כקובץ מצורף (Outlook קלאסי)</b></p>
              <ol class="how"><li>בתיקיית הדואר הנכנס סמנו את המיילים של אתמול (Ctrl+A בתצוגה של אתמול, או חיפוש <span dir="ltr">received:yesterday</span>)</li><li>לחצו <span dir="ltr">Ctrl+Alt+F</span> (העבר כקובץ מצורף)</li><li>בשדה "אל" כתבו את כתובת התיבה של העוזר ושלחו</li><li>אם Outlook אומר שההודעה גדולה מדי, שלחו בשניים או שלושה חלקים; אלכס מאחד אותם לייבוא אחד</li><li>חזרו על זה בתיקייה "פריטים שנשלחו" כדי שגם המיילים שכתבתם ייכנסו (חשוב: כך אלכס יודע מה כבר ענית והבטחת)</li></ol>
              <p class="muted">מייל עם יותר משלושה מיילים מצורפים נחשב לייבוא יומי. כשלא מגיעים חלקים חדשים כ-10 דקות, אלכס מתחיל לעבד, ובסוף שולח סיכום אחד.</p>
              <p><b>דרך חלופית: גרירה לצ׳אט</b></p>
              <ol class="how"><li>גררו את המיילים לתיקייה בשולחן העבודה (הם הופכים לקבצי msg; בקבוצות גדולות Outlook לא תמיד שומר את כולם)</li><li>סמנו את כל הקבצים וגררו אותם לחלון הצ׳אט (אפשר גם קובץ zip שלהם)</li></ol>
              <p><b>Outlook החדש:</b> ייצאו כקבצי eml וגררו לצ׳אט, או העבירו את המיילים כקבצים מצורפים לכתובת התיבה של העוזר.</p>
              <p class="muted">מעל שלושה קבצי מייל בצ׳אט, או הודעה שכוללת "ייבוא יומי", מופיע כרטיס אחד עם התקדמות במקום הודעה לכל קובץ.</p>
            </details>
          </div>
        </div>
      </template>

      <!-- יומן באאוטלוק -->
      <template x-if="setCat()==='calendar'">
        <div class="set-body">
          <div class="set-group">
            <div class="set-row set-col"><span class="set-l"><b>קישור ליומן</b><small>סודי: מי שמחזיק בו רואה את המשימות והפגישות</small></span>
              <div class="copy-row"><input type="text" readonly :value="here(st.calendar_url)" dir="ltr" @focus="$event.target.select()" aria-label="קישור ליומן"><button class="btn small" @click="copyText(here(st.calendar_url))">העתקה</button></div></div>
            <div class="set-row"><span class="set-l"><b>משימות בלבד</b></span><button class="btn small" @click="copyText(st.calendar_url + '?only=tasks')">העתקת קישור</button></div>
            <div class="set-row"><span class="set-l"><b>פגישות בלבד</b></span><button class="btn small" @click="copyText(st.calendar_url + '?only=meetings')">העתקת קישור</button></div>
            <div class="set-row"><span class="set-l"><b>קישור חדש</b><small>הקישור הישן יפסיק לעבוד</small></span><button class="btn small danger" @click="rotateCal()">יצירה</button></div>
            <details class="set-row set-col set-more"><summary>איך מוסיפים לאאוטלוק</summary>
              <ol class="how"><li>באאוטלוק בחרו: הוספת לוח שנה</li><li>בחרו: מהאינטרנט</li><li>הדביקו את הקישור ואשרו</li></ol>
              <p class="muted">אאוטלוק מעדכן יומנים מנויים לבד כל כמה שעות.</p></details>
          </div>
        </div>
      </template>

      <!-- בינה מלאכותית ועלויות -->
      <template x-if="setCat()==='ai' && st.agent">
        <div class="set-body">
          <div class="set-group">
            <div class="set-row"><span class="set-l"><b>סוכן</b><template x-for="o in st.agent.options.filter(x => x.name===st.agent.name)" :key="o.name"><small dir="auto" x-text="o.ready ? '✔ מותקן ומחובר' : '✖ '+o.setup"></small></template></span>
              <select class="set-sel" @change="saveSet({agent_provider: $event.target.value})" aria-label="סוכן" data-test="set-agent">
                <template x-for="o in st.agent.options" :key="o.name"><option :value="o.name" :selected="o.name===st.agent.name" x-text="o.label+(o.ready ? '' : ' (לא מותקן)')"></option></template></select></div>
            <div class="set-row"><span class="set-l"><b>מודל ברירת מחדל</b></span>
              <span class="set-v set-pair">
                <select class="set-sel" @change="pickModel('default', $event.target.value, (v) => saveSet({agent_model: v}))" aria-label="מודל ברירת מחדל"><template x-for="o in modelOpts(st.agent.model)" :key="o[0]"><option :value="o[0]" :selected="o[0]===(setOther==='default' ? '__other' : (st.agent.model||''))" x-text="o[1]"></option></template></select>
                <input type="text" dir="ltr" class="set-other" data-other="default" x-show="setOther==='default'" placeholder="שם המודל" @change="setOther=null; saveSet({agent_model: $event.target.value})" aria-label="שם מודל אחר">
              </span></div>
          </div>
          <h3 class="set-h">מודל ורמת מאמץ לפי סוג עבודה</h3>
          <div class="set-group">
            <template x-for="m in st.agent.models" :key="m.job">
              <div class="set-row model-row" :data-job="m.job"><span class="set-l"><b x-text="m.label"></b></span>
                <span class="set-v set-pair">
                  <select @change="pickModel('m:'+m.job, $event.target.value, (v) => saveModel(m.job, 'model', v))" :aria-label="'מודל: '+m.label"><template x-for="o in modelOpts(m.model)" :key="o[0]"><option :value="o[0]" :selected="o[0]===(setOther==='m:'+m.job ? '__other' : (m.model||''))" x-text="o[1]"></option></template></select>
                  <select @change="pickModel('e:'+m.job, $event.target.value, (v) => saveModel(m.job, 'effort', v))" :aria-label="'מאמץ: '+m.label"><template x-for="o in effortOpts(m.effort)" :key="o[0]"><option :value="o[0]" :selected="o[0]===(setOther==='e:'+m.job ? '__other' : (m.effort||''))" x-text="o[1]"></option></template></select>
                  <input type="text" dir="ltr" class="set-other" :data-other="'m:'+m.job" x-show="setOther==='m:'+m.job" placeholder="מודל" @change="setOther=null; saveModel(m.job, 'model', $event.target.value)" aria-label="שם מודל אחר">
                  <input type="text" dir="ltr" class="set-other" :data-other="'e:'+m.job" x-show="setOther==='e:'+m.job" placeholder="מאמץ" @change="setOther=null; saveModel(m.job, 'effort', $event.target.value)" aria-label="רמת מאמץ אחרת">
                </span></div>
            </template>
          </div>
          <h3 class="set-h">תקציב</h3>
          <div class="set-group">
            <div class="set-row"><span class="set-l"><b>תקרה יומית לעבודה לא דחופה ($)</b><small x-text="'0 = כבוי · היום נוצלו '+usd(st.spent_today_usd)"></small></span>
              <input type="number" class="set-num" min="0" step="1" :value="st.daily_budget_usd" @change="saveSet({daily_budget_usd: $event.target.value})" aria-label="תקרה יומית"></div>
            <div class="set-row"><span class="set-l"><b>שימוש ועלויות</b><small>פירוט לפי יום, סוג עבודה ומודל</small></span><button class="btn small" @click="go('/activity')">פתיחה</button></div>
            <details class="set-row set-col set-more"><summary>פרטים</summary>
              <p>הערכים שווה ערך API. כשהתקרה מושגת נדחית רק עבודה לא דחופה (סיכום זיכרון שבועי, השלמות, חילוץ עובדות מלידיעה בלבד), עד 24 שעות. משימות, דואר שוטף, שרשורי ייבוא, צ׳אט ותזכורות לעולם לא נדחים. בנוסף תקבלו התראה אם ההוצאה היומית גבוהה פי 2 מהממוצע.</p>
              <p>אלכס עובד דרך תוכנת סוכן שכבר מותקנת אצלך ומחוברת לחשבון שלך (Claude Code, Codex או Gemini CLI). המערכת רק מפעילה את התוכנה הרשמית, בלי לגעת בפרטי ההתחברות. ערכי המודל והמאמץ מועברים לסוכן כמו שהם.</p></details>
          </div>
        </div>
      </template>

      <!-- סטטוסים ודחיפויות -->
      <template x-if="setCat()==='tasks'">
        <div class="set-body">
          <h3 class="set-h set-h1">סטטוסים</h3>
          <div class="set-group">
            <template x-for="s in st.statuses" :key="'s'+s.id"><div class="set-row ren"><span class="dot" :style="'background:'+s.color"></span><input type="text" :value="s.name_he" @change="renameItem('statuses', s, $event.target.value)" aria-label="שם סטטוס"></div></template>
          </div>
          <h3 class="set-h">דחיפויות</h3>
          <div class="set-group">
            <template x-for="s in st.priorities" :key="'p'+s.id"><div class="set-row ren"><span class="dot" :style="'background:'+s.color"></span><input type="text" :value="s.name_he" @change="renameItem('priorities', s, $event.target.value)" aria-label="שם דחיפות"></div></template>
          </div>
          <p class="set-hint">שינוי שם חל מיד על כל המשימות.</p>
        </div>
      </template>

      <!-- סל מחזור ושמירה -->
      <template x-if="setCat()==='trash'">
        <div class="set-body">
          <div class="set-group">
            <div class="set-row"><span class="set-l"><b>מחיקה סופית מהסל אחרי</b><small>חל גם על מה שכבר בסל</small></span>
              <select class="set-sel" @change="saveSet({trash_days: $event.target.value}).then(() => loadBoot())" data-test="trash-days" aria-label="ימים בסל המחזור"><template x-for="o in trashOpts(st.trash_days)" :key="o[0]"><option :value="o[0]" :selected="String(o[0])===String(st.trash_days)" x-text="o[1]"></option></template></select></div>
            <div class="set-row"><span class="set-l"><b>סל המחזור</b><small x-text="boot.trash_total ? boot.trash_total+' פריטים בסל' : 'הסל ריק'"></small></span><button class="btn small" @click="go('/trash')">פתיחה</button></div>
            <div class="set-row"><span class="set-l"><b>שמירה בתיבת הדואר של המערכת</b><small>מיילים שטופלו ונשמרו במלואם נמחקים מהתיבה (לא מהארכיון)</small></span>
              <select class="set-sel" @change="saveSet({mailbox_keep_days: $event.target.value})" data-test="mailbox-keep" aria-label="ימי שמירה בתיבה"><template x-for="o in keepOpts(st.mailbox_keep_days)" :key="o[0]"><option :value="o[0]" :selected="String(o[0])===String(st.mailbox_keep_days)" x-text="o[1]"></option></template></select></div>
            <details class="set-row set-col set-more"><summary>פרטים</summary>
              <p>כל מה שנמחק (משימות, פרויקטים, אנשים, פרוטוקולים, פריטי יומן, הודעות, כללי דואר) עובר קודם לסל המחזור ונמחק סופית אחרי מספר הימים שנבחר. ניקוי התיבה רץ בכל לילה; קבצים בארכיון לא נמחקים אוטומטית.</p></details>
          </div>
        </div>
      </template>

      <!-- גיבוי והצפנה -->
      <template x-if="setCat()==='backup'">
        <div class="set-body bk-card">
          <h3 class="sr">גיבוי והצפנה</h3>
          <template x-if="bk.st">
            <div class="set-group bk-stat">
              <div class="set-row"><span class="set-l"><b>גיבוי מקומי אחרון</b></span><span class="set-val" x-text="bk.st.local.last_at ? fmtDateTime(bk.st.local.last_at) : 'אין'"></span></div>
              <div class="set-row"><span class="set-l"><b>גיבוי אחרון ל-Proton Drive</b></span><span class="set-val" x-text="bk.st.offsite.last_success_at ? fmtDateTime(bk.st.offsite.last_success_at) : (bk.st.offsite.configured ? 'עדיין לא הצליח' : 'עדיין לא הופעל')"></span></div>
              <div class="set-row"><span class="set-l"><b>תוצאה אחרונה</b></span><span class="set-val" :class="{'bk-bad': bk.st.offsite.last_ok === false}" x-text="bk.st.offsite.configured ? (bk.st.offsite.last_ok ? 'הצליח' + (bk.st.offsite.last_run_at ? ' · ' + fmtDateTime(bk.st.offsite.last_run_at) : '') : 'נכשל: ' + (bk.st.offsite.last_error || '')) : 'לא רץ עדיין'"></span></div>
              <div class="set-row"><span class="set-l"><b>מקום בתיקיית Proton</b></span><span class="set-val" x-text="bk.st.offsite.remote_bytes != null ? fmtGB(bk.st.offsite.remote_bytes) : 'לא ידוע'"></span></div>
              <div class="set-row"><span class="set-l"><b>עותקי מסד נתונים ב-Proton</b></span><span class="set-val" x-text="bk.st.offsite.copies != null ? bk.st.offsite.copies : 'לא ידוע'"></span></div>
            </div>
          </template>
          <h3 class="set-h">מפתח ההצפנה</h3>
          <div class="set-group bk-key-area">
            <div class="set-row" x-show="!bk.key && !bk.ask"><span class="set-l"><b>מפתח ההצפנה</b><small>בלי המפתח אי אפשר לשחזר את הנתונים מאף גיבוי</small></span>
              <button class="btn small" @click="bk.ask = true; bk.err = ''; $nextTick(() => $refs.bkpw && $refs.bkpw.focus())">הצג מפתח הצפנה</button></div>
            <form x-show="bk.ask && !bk.key" @submit.prevent="bkShow()" class="set-row set-col bk-form">
              <label class="field"><span>הקלידו שוב את סיסמת האתר</span>
                <input type="password" x-ref="bkpw" x-model="bk.pw" autocomplete="current-password" aria-label="סיסמת האתר"></label>
              <p class="sm cn-err" x-show="bk.err" x-text="bk.err"></p>
              <div class="btnrow"><button class="btn small primary" type="submit" :disabled="bk.busy || !bk.pw">הצג</button><button class="btn small" type="button" @click="bkHide()">ביטול</button></div>
            </form>
            <div x-show="bk.key" class="set-row set-col bk-shown">
              <div class="bk-key" dir="ltr" x-text="bk.key" @focus="$event.target.select()" tabindex="0"></div>
              <div class="btnrow"><button class="btn small" @click="copyText(bk.key)">העתק</button><button class="btn small" @click="bkHide()">הסתר</button></div>
              <p class="sm">שמרו את המפתח ב-Bitwarden. בלי המפתח אי אפשר לשחזר את הנתונים.</p>
            </div>
          </div>
          <p class="set-hint">כל המידע מוצפן בדיסק, וכל לילה נשמר גיבוי מוצפן ב-Proton Drive.</p>
        </div>
      </template>

      <!-- חשבון ואבטחה -->
      <template x-if="setCat()==='account'">
        <div class="set-body">
          <h3 class="set-h set-h1">שינוי סיסמה</h3>
          <div class="set-group">
            <form @submit.prevent="changePassword()" class="set-row set-col pw-form">
              <input type="password" x-model="pw.old" autocomplete="current-password" placeholder="הסיסמה הנוכחית" aria-label="הסיסמה הנוכחית">
              <input type="password" x-model="pw.new" autocomplete="new-password" placeholder="סיסמה חדשה (לפחות 12 תווים)" aria-label="סיסמה חדשה">
              <div class="set-foot"><small class="muted">אחרי השינוי מתחברים מחדש בשאר המכשירים</small><button class="btn small primary" type="submit" :disabled="!pw.old || pw.new.length < 12">שינוי סיסמה</button></div>
            </form>
          </div>
          <template x-if="st.urls">
            <div>
              <h3 class="set-h">כתובות האתר</h3>
              <div class="set-group">
                <div class="set-row set-col"><span class="set-l"><b>ראשית</b></span>
                  <div class="copy-row"><input type="text" readonly :value="st.urls.main" dir="ltr" @focus="$event.target.select()" aria-label="כתובת ראשית"><button class="btn small" @click="copyText(st.urls.main)">העתקה</button></div></div>
                <template x-if="st.urls.mirror">
                  <div class="set-row set-col"><span class="set-l"><b>מהעבודה</b><small>מראה של האתר לרשתות שחוסמות את הכתובת הראשית</small></span>
                    <div class="copy-row"><input type="text" readonly :value="st.urls.mirror" dir="ltr" @focus="$event.target.select()" aria-label="כתובת מהעבודה"><button class="btn small" @click="copyText(st.urls.mirror)">העתקה</button></div></div>
                </template>
                <template x-if="st.urls.mirror">
                  <label class="set-row"><span class="set-l"><b>קישורים דרך כתובת "מהעבודה"</b><small>בטלגרם, במייל וביומן</small></span>
                    <input type="checkbox" class="tgl" :checked="st.links_use_mirror" @change="saveSet({links_use_mirror: $event.target.checked})"></label>
                </template>
              </div>
            </div>
          </template>
          <div class="set-group set-gap">
            <div class="set-row"><span class="set-l"><b>יציאה מהאתר</b><small>במכשיר הזה</small></span><button class="btn small danger" @click="logout()">יציאה</button></div>
          </div>
        </div>
      </template>

      <!-- מצב המערכת -->
      <template x-if="setCat()==='system'">
        <div class="set-body">
          <template x-if="sysHealth">
            <div class="health-card">
              <div class="set-group">
                <div class="set-row"><span class="set-l"><b>בדיקה מלאה</b><small>כל 15 דקות; תקלה אדומה מדווחת לכם פעם אחת, ושוב כשהיא חוזרת לתקין</small></span><span class="set-val"><b x-text="sysHealth.summary || 'עדיין לא רצה בדיקה'"></b></span></div>
                <template x-for="c in sysHealth.checks" :key="c.id">
                  <div class="set-row hc-row"><span class="hc-dot" :class="c.status" :title="c.status"></span><span class="set-l"><b x-text="c.label"></b><small x-text="c.message"></small></span><small class="muted hc-t" x-text="fmtDateTime(c.at)"></small></div>
                </template>
              </div>
            </div>
          </template>
          <template x-if="health">
            <div>
              <h3 class="set-h">שירותים</h3>
              <div class="set-group">
                <template x-for="c in health.components" :key="c.id">
                  <div class="set-row hrow"><span class="dot" :class="c.ok ? 'ok' : 'bad'"></span><span class="set-l"><b x-text="c.label"></b><small x-text="c.detail"></small></span></div>
                </template>
              </div>
            </div>
          </template>
          <h3 class="set-h">אחסון</h3>
          <div class="set-group">
            <template x-if="storage">
              <div>
                <div class="set-row"><span class="set-l"><b>דיסק השרת</b></span><span class="set-val" x-text="fmtGB(storage.disk_free)+' פנויים מתוך '+fmtGB(storage.disk_total)+' ('+storage.disk_free_pct+'%)'"></span></div>
                <div class="set-row"><span class="set-l"><b>קבצים (ארכיון)</b></span><span class="set-val" x-text="fmtGB(storage.files)"></span></div>
                <div class="set-row"><span class="set-l"><b>מסד נתונים ויומני הרצה</b></span><span class="set-val" x-text="fmtGB(storage.data)"></span></div>
                <div class="set-row"><span class="set-l"><b>גיבויים</b></span><span class="set-val" x-text="fmtGB(storage.backups)"></span></div>
                <div class="set-row"><span class="set-l"><b>מודלים</b></span><span class="set-val" x-text="fmtGB(storage.models)"></span></div>
              </div>
            </template>
            <div class="set-row"><span class="set-l"><b>גודל קובץ מרבי להעלאה</b><small x-text="'בטלגרם: '+(st.telegram_max_mb >= 1000 ? '2 ג״ב' : '20 מ״ב')"></small></span>
              <select class="set-sel" @change="saveSet({max_file_mb: $event.target.value})" aria-label="גודל קובץ מרבי" data-test="max-file"><template x-for="o in mbOpts(st.max_file_mb)" :key="o[0]"><option :value="o[0]" :selected="String(o[0])===String(st.max_file_mb)" x-text="o[1]"></option></template></select></div>
            <details class="set-row set-col set-more"><summary>פרטים</summary>
              <p>קבצים גדולים עולים באתר בחלקים ואפשר להמשיך אחרי ניתוק. את הטקסט של קבצים ענקיים קוראים ברקע ובמגבלה (למשל 300 העמודים הראשונים של PDF), ווידאו ואודיו נשמרים בלי אינדקס. השירותים נבדקים כל 5 דקות; שירות שנופל מופעל מחדש פעם אחת, ואם הבעיה נמשכת תגיע אליכם הודעה.</p></details>
          </div>
        </div>
      </template>
    </section>
  </div>
  </template>
</div>
</template>

<!-- ===== PEOPLE ===== -->
<template x-if="route.name==='people'">
<div>
  <div class="page-h"><h1>אנשים</h1></div>
  <form class="add-row" @submit.prevent="addPerson()">
    <input type="text" x-model="newPerson.name" placeholder="שם" aria-label="שם">
    <input type="email" x-model="newPerson.email" placeholder="כתובת דוא״ל (אופציונלי)" aria-label="כתובת דוא״ל" style="direction:ltr;text-align:right">
    <select x-model="newPerson.role" aria-label="תפקיד"><option value="contact">איש קשר</option><option value="pm">מנהל פרויקט</option></select>
    <button class="btn primary" type="submit" :disabled="!newPerson.name.trim()">הוספה</button>
  </form>
  <template x-for="grp in peopleGroups()" :key="grp.title">
    <div>
      <h2 class="sec-h" x-text="grp.title"></h2>
      <div class="grid-list">
        <template x-for="p in grp.items" :key="p.id">
          <div class="card item">
            <div class="item-h">
              <div class="name"><span x-text="personLabel(p)"></span>
                <span class="sub" x-text="roleLabel(p.role)+' · '+openCountFor(p)+' משימות פתוחות'"></span></div>
              <button class="btn small" @click="filterByAssignee(p.id)" x-show="p.role!=='contact'">משימות</button>
              <button class="btn small" @click="toggleEdit('u'+p.id, p)" x-text="editing==='u'+p.id ? 'סגירה' : 'עריכה'"></button>
            </div>
            <div class="partial-line" x-show="p.status==='partial'"><span class="pbadge">חלקי</span> <span class="muted" x-text="p.missing.length ? 'חסר: '+p.missing.join(', ') : 'פרטים חלקיים'"></span></div>
            <div class="muted" style="font-size:.88rem;margin-top:2px" x-show="p.company || p.role_text" x-text="[p.role_text, p.company].filter(Boolean).join(' · ')"></div>
            <div class="muted" style="font-size:.88rem;margin-top:4px" x-show="p.notes" x-text="p.notes"></div>
            <button class="btn small" style="margin-top:6px" @click="togglePersonCard(p)" x-text="personCard && personCard.id===p.id ? 'הסתר פירוט' : 'אזכורים ומשימות'"></button>
            <template x-if="personCard && personCard.id===p.id">
              <div class="pcard">
<div class="sect sc-chat" x-data x-init="scLoad('person:'+p.id)">
  <h3>שיחה עם <span x-text="assistantName()"></span> על איש הקשר</h3>
  <div class="tc-feed sc-feed" x-show="scMsgs('person:'+p.id).length>0" x-effect="scMsgs('person:'+p.id).length && scScroll()">
    <button type="button" class="tc-more" x-show="convHidden(scMsgs('person:'+p.id), 'person:'+p.id)" @click="unfold('person:'+p.id)" x-text="'הודעות קודמות ('+convHidden(scMsgs('person:'+p.id), 'person:'+p.id)+')'"></button>
    <template x-for="{m, day, key} in convItems(scMsgs('person:'+p.id), 'person:'+p.id)" :key="key">
      <div class="tc-item" :class="m.author"><div class="day-sep" x-show="day"><span x-text="day"></span></div>
      <div class="bubble tc-b" :class="m.author">
        <div class="b-head"><span class="actor" :class="{claude: m.author==='claude'}" x-text="m.author==='claude' ? assistantName() : ownerName()"></span><span class="b-time" x-text="hm(m.created_at)" :title="fmtDateTime(m.created_at)"></span></div>
        <div class="b-text" x-show="!m.confirm" x-html="chatHtml(m.text, m.refs)"></div>
        <div class="cf-card" x-show="m.confirm" x-cloak>
          <p class="b-text" x-text="m.confirm ? m.confirm.text : ''"></p>
          <div class="btnrow" x-show="m.confirm && m.confirm.status==='open'"><button class="btn danger" @click="answerConfirm(m, true)" x-text="(m.confirm && m.confirm.yes_label) || 'כן, למחוק'"></button><button class="btn" @click="answerConfirm(m, false)">לא</button></div>
          <p class="muted sm" x-show="m.confirm && m.confirm.status==='no'">בסדר, לא נמחק.</p>
          <p class="muted sm" x-show="m.confirm && m.confirm.status==='failed'" x-text="m.confirm && m.confirm.result ? m.confirm.result.error : ''"></p>
          <p class="sm" x-show="m.confirm && m.confirm.status==='yes'"><b x-text="confirmDone(m.confirm)"></b> <button class="btn small" x-show="canRestore(m.confirm)" @click="undoPurge(m.confirm)">שחזר</button></p>
        </div>
      </div></div>
    </template>
    <div class="bubble claude thinking-b" x-show="busy() && sc.waiting===('person:'+p.id)"><span class="dots"><i></i><i></i><i></i></span> <span x-text="assistantName()+' חושב…'"></span></div>
  </div>
  <form class="tc-form" @submit.prevent="scSend('person:'+p.id)">
    <textarea x-model="sc.text" rows="1" class="tc-in comp-input" :placeholder="'כתוב ל'+assistantName()+' על איש הקשר…'" :aria-label="'כתוב ל'+assistantName()+' על איש הקשר'" enterkeyhint="send" @input="autosize($event.target)"
      @keydown.enter="if(!$event.shiftKey && !$event.isComposing){ $event.preventDefault(); scSend('person:'+p.id); }"></textarea>
    <button type="submit" class="btn primary" :disabled="sc.sending || !sc.text.trim()">שליחה</button>
  </form>
</div>
                <h4>משימות (<span x-text="personCard.tasks.length"></span>)</h4>
                <template x-for="t in personCard.tasks" :key="'pt'+t.id"><button class="mini-row" @click="openTask(t.id)"><b x-text="t.title"></b><span class="muted" x-text="(t.role==='requester' ? 'מאת · ' : 'אחראי · ')+t.project+' · '+t.status"></span></button></template>
                <p class="muted" x-show="!personCard.tasks.length">אין משימות מקושרות</p>
                <h4>אזכורים (<span x-text="personCard.mentions.length"></span>)</h4>
                <template x-for="m in personCard.mentions" :key="'pm'+m.id"><div class="mention"><span class="muted" x-text="({task:'משימה',chat:'צ׳אט',note:'הערה',knowledge:'ידע',email:'מייל',protocol_item:'פרוטוקול'})[m.source_type]+' · '"></span><a href="#" x-show="m.task_id" @click.prevent="openTask(m.task_id)" x-text="m.text"></a><span x-show="!m.task_id" x-text="m.text"></span></div></template>
                <p class="muted" x-show="!personCard.mentions.length">אין אזכורים</p>
                <p class="stamps muted" x-show="personCard.stamps && personCard.stamps.created_at"><span x-text="'נוצר: '+fmtDateTime(personCard.stamps && personCard.stamps.created_at)"></span><br><span x-text="'עדכון אחרון: '+fmtDateTime(personCard.stamps.updated_at)"></span></p>
              </div>
            </template>
            <div class="muted" style="direction:ltr;text-align:right;font-size:.85rem;margin-top:2px;overflow-wrap:anywhere" x-show="p.emails.length" x-text="p.emails.join(', ')"></div>
            <div class="item-edit" x-show="editing==='u'+p.id">
              <label class="field"><span>שם בעברית</span><input type="text" x-model="form.name"></label>
              <label class="field"><span>שם לועזי (לזיהוי במיילים)</span><input type="text" x-model="form.name_en" style="direction:ltr;text-align:right"></label>
              <label class="field" x-show="p.role==='pm'||p.role==='contact'"><span>תפקיד</span>
                <select x-model="form.role"><option value="pm">מנהל פרויקט</option><option value="contact">איש קשר</option></select></label>
              <label class="field"><span>כתובות דוא״ל (מופרדות בפסיק)</span><input type="text" x-model="form.emails" style="direction:ltr;text-align:right"></label>
              <label class="field"><span>הערות</span><textarea x-model="form.notes" style="min-height:72px"></textarea></label>
              <div class="btnrow"><button class="btn primary" @click="savePerson(p)">שמירה</button></div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>
</template>

</main>

<div class="upload-panel" x-show="uploads.length" x-cloak aria-live="polite">
  <template x-for="u in uploads" :key="u.id">
    <div class="up-item" :class="{err: u.error}">
      <div class="up-top"><b x-text="u.name"></b><button class="up-x" x-show="u.done" @click="uploads = uploads.filter(x => x.id !== u.id)" aria-label="סגירה">✕</button></div>
      <div class="up-bar"><div class="up-fill" :style="'width:'+u.pct+'%'"></div></div>
      <div class="muted sm" x-text="u.text"></div>
    </div>
  </template>
</div>

<nav class="bottomnav" aria-label="ניווט ראשי">
  <button :class="{on: route.name==='home'||route.name==='task'}" @click="go('/')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h9"/></svg>ראשי</button>
  <button :class="{on: route.name==='mail'||route.name==='email'}" @click="go('/mail')" data-test="bar-mail">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>דואר</button>
  <button :class="{on: route.name==='projects'}" @click="go('/projects')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>פרויקטים</button>
  <button :class="{on: route.name==='calendar'}" @click="go('/calendar')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>יומן</button>
  <button :class="{on: ['search','protocols','archive','trash','activity','people','settings'].includes(route.name) || moreOpen}" @click="moreOpen=!moreOpen">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>עוד</button>
</nav>
<div class="more-bg" x-show="moreOpen" @click="moreOpen=false">
  <div class="more-sheet" @click.stop>
    <button @click="moreOpen=false; go('/search')">חיפוש</button>
    <button @click="moreOpen=false; go('/protocols')">פרוטוקולים</button>
    <button @click="moreOpen=false; go('/archive')">📦 ארכיון</button>
    <button @click="moreOpen=false; go('/trash')" data-test="more-trash" x-text="'🗑 סל מחזור'+(boot.trash_total ? ' ('+boot.trash_total+')' : '')"></button>
    <button @click="moreOpen=false; go('/activity')">פעילות</button>
    <button @click="moreOpen=false; go('/people')">אנשים</button>
    <button @click="moreOpen=false; go('/settings')">הגדרות</button>
  </div>
</div>


<!-- ===== CHAT PANEL (permanent on wide screens, sheet on phones) ===== -->
<div class="chat-backdrop" x-show="chatOpen" x-transition.opacity @click="closeChat()"></div>
<button class="chat-bar" @click="chatBarClick()" aria-label="פתיחת הצ׳אט" title="פתיחת הצ׳אט">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
  <svg class="bar-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  <span class="bar-label">פתיחת הצ׳אט</span>
  <span class="badge" x-show="unread()>0" x-text="unread()"></span>
</button>
<button class="chat-pin" x-show="route.name==='home' && !chatOpen" @click="openChat(true)" aria-label="כתוב לי">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
  <span class="pin-text" x-text="searching() ? 'אלכס מחפש באינטרנט…' : busy() ? 'אלכס חושב…' : 'כתוב לי…'"></span>
  <span class="badge" x-show="unread()>0" x-text="unread()"></span>
</button>
<div class="divider divider-chat" data-pane="chat" role="separator" aria-orientation="vertical" aria-label="שינוי רוחב הצ׳אט" tabindex="0" title="גרירה לשינוי הרוחב, לחיצה כפולה לאיפוס"><span class="grip"><i></i><i></i><i></i></span></div>
<aside class="chat-panel" :class="{open: chatOpen, 'drop-active': dropping==='chat'}" aria-label="צ׳אט עם אלכס" @dragenter="dragOver('chat', $event)" @dragover="dragOver('chat', $event)" @dragleave="dragLeave('chat', $event)" @drop="dropOn('chat', $event)">
  <div class="drop-overlay" x-show="dropping==='chat'" x-cloak><span>שחרר כאן כדי לשלוח לאלכס</span></div>
  <div class="cp-head">
    <span class="grab" aria-hidden="true"></span>
    <b>צ׳אט עם אלכס</b>
    <span class="muted cp-status" x-text="searching() ? 'מחפש באינטרנט…' : busy() ? 'חושב…' : ''"></span>
    <span class="spacer"></span>
    <label class="cp-tog" title="הצג גם שיחות מפרויקטים ומשימות"><input type="checkbox" :checked="chatTaskMsgs" @change="setChatTaskMsgs($event.target.checked)"><span class="cp-tog-long">הצג גם שיחות מפרויקטים ומשימות</span><span class="cp-tog-short">גם שיחות</span></label>
    <button class="icon-btn cp-collapse" @click="MesimotLayout.setCollapsed(true)" aria-label="כיווץ הצ׳אט" title="כיווץ הצ׳אט"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="icon-btn cp-close" @click="closeChat()" aria-label="סגירת הצ׳אט" title="סגירה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="feed" x-ref="feed" @click="chatClick($event)">
    <template x-if="chatMsgs.length===0"><div class="empty"><b>עדיין אין הודעות</b>כתבו לאלכס מה צריך לעשות, והוא ידאג למשימות</div></template>
    <template x-for="m in chatView()" :key="m.id">
      <div class="bubble" :class="[m.author, {scoped: !!m.scope}]">

</div>
<div class="purge-undo" x-show="purgeUndo && purgeLeft()>0" x-cloak role="status" aria-live="polite"><span x-text="'הועבר לסל: '+(purgeUndo ? clipText(purgeUndo.title, 90) : '')"></span><button class="btn small" @click="undoPurge(purgeUndo)">בטל</button></div>

<div class="picker-bg" x-show="delDlg" x-cloak @click.self="delDlg=null" @keydown.escape.window="delDlg=null">
  <div class="picker del-dlg" role="dialog" aria-modal="true" x-show="delDlg">
    <div class="pk-head"><b>מחיקת הודעה</b><button class="icon-btn" @click="delDlg=null" aria-label="סגירה">✕</button></div>
    <p class="muted" x-text="delDlg ? clipText(delDlg.m.text, 120) : ''"></p>
    <p class="muted sm" x-text="'ההודעה תועבר לסל המחזור. '+binKeepText()"></p>
    <template x-if="delDlg && delDlg.m && delDlg.m.author==='owner'"><label class="switch-row"><input type="checkbox" x-model="delDlg.undo"><span>בטל גם את מה שאלכס עשה בעקבות ההודעה</span></label></template>
    <div class="btnrow"><button class="btn danger" @click="confirmDelete()">העבר לסל</button><button class="btn" @click="delDlg=null">ביטול</button></div>
  </div>
</div>

<div class="picker-bg" x-show="picker" x-transition.opacity @click.self="closePicker()" @keydown.escape.window="closePicker()">
  <div class="picker" role="dialog" aria-modal="true" :style="pickerStyle()">
    <div class="pk-head"><b x-text="picker ? picker.title : ''"></b><button class="icon-btn" @click="closePicker()" aria-label="סגירה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <template x-if="picker && (picker.type==='due' || picker.type==='received')">
      <div class="pk-date">
        <div class="pk-chips" x-show="picker.type==='due'">
          <button class="chip" @click="pickDate(offsetDate(0))">היום</button>
          <button class="chip" @click="pickDate(offsetDate(1))">מחר</button>
          <button class="chip" @click="pickDate(offsetDate(7))">בעוד שבוע</button>
          <button class="chip" x-show="detail && detail.due_date" @click="pickDate('')">ניקוי</button>
        </div>
        <input type="date" class="pk-input" x-model="picker.date" aria-label="תאריך">
        <input type="time" class="pk-input" x-model="picker.time" x-show="picker.type==='received'" aria-label="שעה">
        <button class="btn primary" @click="pickDate(picker.type==='received' ? picker.date+' '+(picker.time||'00:00') : picker.date)" :disabled="!picker.date">אישור</button>
      </div>
    </template>
    <template x-if="picker && picker.type==='fact'">
      <div class="pk-fact">
        <div class="pf-now"><b x-text="picker.fact.value + (picker.fact.unit ? ' ' + picker.fact.unit : '')"></b> <span class="muted" x-text="'נכון ל־' + dayOf(picker.fact.as_of_date)"></span></div>
        <div class="pf-hist">
          <template x-for="h in picker.history" :key="h.id">
            <div class="pf-row" :class="{cur: h.current}">
              <b x-text="h.value + (h.unit ? ' ' + h.unit : '')"></b>
              <span class="muted" x-text="dayOf(h.as_of_date) + (h.current ? ' · הנוכחי' : '')"></span>
              <button class="btn small ghost" x-show="h.source" @click="openFactSource(h)" x-text="factSourceLabel(h)"></button>
              <span class="muted" x-show="!h.source" x-text="factSourceLabel(h)"></span>
            </div>
          </template>
        </div>
        <div class="pf-edit">
          <input type="text" x-model="picker.value" placeholder="ערך חדש" aria-label="ערך">
          <input type="text" x-model="picker.unit" placeholder="יחידה (אופציונלי)" aria-label="יחידה">
          <input type="date" x-model="picker.date" class="pk-input" aria-label="נכון לתאריך">
          <button class="btn primary" @click="saveFact()" :disabled="!picker.value.trim() || !picker.date">עדכון הנתון</button>
        </div>
      </div>
    </template>
    <template x-if="picker && picker.type==='event'">
      <div class="pk-fact pf-edit">
        <input type="text" x-model="picker.key" placeholder="כותרת האירוע" aria-label="כותרת">
        <input type="date" x-model="picker.date" class="pk-input" aria-label="תאריך">
        <label class="switch-row"><input type="checkbox" x-model="picker.allday"><span>כל היום</span></label>
        <input type="time" x-model="picker.time" class="pk-input" x-show="!picker.allday" aria-label="שעה">
        <input type="text" x-model="picker.location" placeholder="מקום (אופציונלי)" aria-label="מקום">
        <button class="btn primary" @click="saveEvent()" :disabled="!picker.key.trim() || !picker.date">הוספה ליומן</button>
      </div>
    </template>
    <template x-if="picker && picker.type==='factnew'">
      <div class="pk-fact pf-edit">
        <input type="text" x-model="picker.key" placeholder="שם הנתון, למשל: סטטוס שלד" aria-label="שם הנתון">
        <input type="text" x-model="picker.value" placeholder="ערך" aria-label="ערך">
        <input type="text" x-model="picker.unit" placeholder="יחידה (אופציונלי)" aria-label="יחידה">
        <input type="date" x-model="picker.date" class="pk-input" aria-label="נכון לתאריך">
        <button class="btn primary" @click="saveFact()" :disabled="!picker.key.trim() || !picker.value.trim() || !picker.date">הוספה לכרטיס</button>
      </div>
    </template>
    <template x-if="picker && !(['due','received','fact','factnew','event'].includes(picker.type))">
      <div class="pk-list">
        <template x-for="o in pickerOptions()" :key="o.key">
          <button class="pk-opt" :class="{on: o.on}" @click="pickValue(o.value)"><i x-show="o.color" :style="'background:'+o.color"></i><span x-text="o.label"></span><span class="pk-sub" x-show="o.sub" x-text="o.sub"></span></button>
        </template>
      </div>
    </template>
  </div>
</div>

<div class="toast done-toast" x-show="doneUndo" x-cloak x-transition.opacity><span class="dt-msg">✔ הושלם</span><button type="button" class="dt-undo" @click="undoDoneNow()">ביטול</button></div>
<div class="toast" :class="{err: toastErr}" x-show="toastMsg" x-transition.opacity><span x-text="toastMsg"></span></div>

<!-- project settings: a real dialog on document.body level (fixed, centered, backdrop), never inside a pane -->
<div class="sheet-bg" x-show="menuOpen && pp" x-cloak x-transition.opacity @click.self="closeMenu()" @keydown.escape.window="menuOpen && closeMenu()" @keydown.tab="trapTab($event)">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pm-title" x-ref="pmenu" x-show="menuOpen && pp">
    <div class="sheet-head"><b id="pm-title">הגדרות פרויקט</b>
      <button type="button" class="icon-btn" @click="closeMenu()" aria-label="סגירה" title="סגירה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <template x-if="pp">
    <div class="sheet-body">
      <label class="field"><span>שם הפרויקט</span><input type="text" x-model="form.name" autocomplete="off"></label>
      <label class="field"><span>כינויים (מופרדים בפסיק)</span><input type="text" x-model="form.aliases" autocomplete="off"></label>
      <div class="field" x-show="!pp.project.is_default"><span>צבע</span>
        <div class="swatches"><template x-for="c in colors" :key="c"><button type="button" class="sw" :class="{on: form.color===c}" :style="'background:'+c" @click="form.color=c" aria-label="בחירת צבע"></button></template></div></div>
      <label class="field"><span>מצב הפרויקט</span><select x-model="form.status"><option>פעיל</option><option>מושהה</option><option>סגור</option></select></label>
      <div class="btnrow sheet-actions"><button class="btn primary" @click="saveProject(pp.project)">שמירה</button><button class="btn" type="button" @click="closeMenu()">ביטול</button></div>
      <div class="field sheet-merge" x-show="!pp.project.is_default"><span>מיזוג לתוך פרויקט אחר</span>
        <select x-model="mergeInto"><option value="">בחרו פרויקט יעד</option>
          <template x-for="o in boot.projects.filter(x=>x.id!==pp.project.id)" :key="o.id"><option :value="o.id" x-text="o.name_he"></option></template></select>
        <button class="btn danger" :disabled="!mergeInto" @click="mergeProject(pp.project)">מיזוג הפרויקט</button>
        <small class="muted">כל המשימות והמידע יעברו לפרויקט היעד, והשם הנוכחי יישמר ככינוי.</small></div>
    </div>
    </template>
  </div>
</div>

<div class="modal-bg" x-show="dlg" x-transition.opacity @keydown.escape.window="closeDlg(false)">
  <div class="modal" role="dialog" aria-modal="true" @click.outside="closeDlg(false)">
    <p x-text="dlg && dlg.msg"></p>
    <div class="btnrow"><button class="btn primary" @click="closeDlg(true)" x-text="dlg && dlg.ok"></button><button class="btn" @click="closeDlg(false)">ביטול</button></div>
  </div>
</div>
</body>
</html>
