<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alex Tasks">
<title>Alex Tasks</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="/assets/app.css">
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<script src="/assets/sha256.js"></script>
<script src="/assets/layout.js"></script>
<script src="/assets/push.js"></script>
<script src="/assets/app.js"></script>
<script defer src="/assets/vendor/alpine.min.js"></script>
</head>
<body x-data="app()" x-init="init()" x-cloak>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><img class="logo" src="/assets/logo-64.png?v=2" width="34" height="34" alt="" aria-hidden="true"><span dir="ltr">Alex Tasks</span></div>
    <nav class="tabs" aria-label="ניווט ראשי">
      <button class="tab" :class="{on: route.name==='home'||route.name==='task'}" @click="go('/')">ראשי</button>
      <button class="tab" :class="{on: route.name==='mail'||route.name==='email'}" @click="go('/mail')" data-test="tab-mail">דואר</button>
      <button class="tab" :class="{on: route.name==='search'}" @click="go('/search')">חיפוש</button>
      <button class="tab" :class="{on: route.name==='projects'}" @click="go('/projects')">פרויקטים</button>
      <button class="tab" :class="{on: route.name==='protocols'}" @click="go('/protocols')">פרוטוקולים</button>
      <button class="tab" :class="{on: route.name==='calendar'}" @click="go('/calendar')">יומן</button>
      <button class="tab" :class="{on: route.name==='activity'}" @click="go('/activity')">פעילות</button>
      <button class="tab" :class="{on: route.name==='people'}" @click="go('/people')">אנשים</button>
    </nav>
    <span class="spacer"></span>
    <span class="agent-status" :class="{busy: busy()}" x-text="statusText()" aria-live="polite"></span>
    <button class="icon-btn" :class="{on: route.name==='trash'}" @click="go('/trash')" aria-label="סל מחזור" title="סל מחזור" data-test="top-trash">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
    </button>
    <button class="icon-btn" :class="{on: route.name==='settings'}" @click="go('/settings')" aria-label="הגדרות" title="הגדרות">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <button class="icon-btn" @click="toggleTheme()" aria-label="החלפת מצב תצוגה" title="החלפת מצב תצוגה">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="icon-btn" @click="logout()" aria-label="יציאה" title="יציאה">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </div>
</header>

<main class="page" :class="{pinpad: route.name==='home'}" x-show="ready">

<!-- ===== HOME ===== -->
<template x-if="route.name==='home' || route.name==='task'">
<div class="split home-split" :class="{'has-task': route.name==='task'}">

  <section class="pane-list" aria-label="רשימת משימות">

    <div class="attn">
      <button class="attn-line" type="button" @click="showAttn=!showAttn" :aria-expanded="showAttn">
        <span class="attn-t">תשומת לב</span><span class="badge" :class="{zero: attnCount()===0}" x-text="attnCount()"></span>
        <span class="plus-btn" role="button" tabindex="0" @click.stop="showManual=!showManual" @keydown.enter.stop="showManual=!showManual" aria-label="הוספת משימה ידנית" title="הוספת משימה ידנית">+</span>
        <svg class="chev" :class="{up: showAttn}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="attn-body" x-show="showAttn" x-transition.opacity>
        <p class="muted" style="margin:6px 0" x-show="attnCount()===0">אין כרגע דבר שדורש תשומת לב</p>
        <template x-for="t in overdue" :key="'o'+t.id">
          <div class="attn-item">
            <button class="grow" @click="openTask(t.id)">
              <span class="t" x-text="t.title"></span>
              <span class="s"><span class="late">באיחור: <span x-text="fmtDate(t.due_date)"></span></span><span x-text="t.project"></span></span>
            </button>
          </div>
        </template>
        <template x-for="a in attention" :key="'a'+a.id">
          <div class="attn-item">
            <div class="grow">
              <span class="t" x-text="a.text"></span>
              <span class="s" x-text="kindLabel(a.kind)"></span>
            </div>
            <button class="btn small primary" @click="setAttention(a,'accepted')">אישור</button>
            <button class="btn small" @click="setAttention(a,'dismissed')">דחייה</button>
          </div>
        </template>
      </div>
    </div>

    <div class="manual" x-show="showManual">
      <form class="add-row" @submit.prevent="quickAdd()" style="margin:0 0 10px">
        <input type="text" x-model="quickTitle" placeholder="כותרת המשימה" aria-label="כותרת המשימה" autocomplete="off">
        <button class="btn primary" type="submit" :disabled="!quickTitle.trim()">הוספת משימה</button>
      </form>
    </div>

    <div class="searchbar">
      <input type="search" x-model="filters.q" @input.debounce.300ms="loadTasks()" placeholder="חיפוש משימות" aria-label="חיפוש משימות">
      <button class="btn filter-btn" :class="{on: showFilters || activeChips().length}" @click="showFilters=!showFilters" :aria-expanded="showFilters">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>
        סינון<span class="badge sm" x-show="activeChips().length" x-text="activeChips().length"></span>
      </button>
      <div class="density" role="group" aria-label="גודל השורות">
        <button type="button" :class="{on: density==='compact'}" @click="setDensity('compact')" aria-label="קטן" title="שורות קטנות" :aria-pressed="density==='compact'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <button type="button" :class="{on: density==='regular'}" @click="setDensity('regular')" aria-label="רגיל" title="שורות רגילות" :aria-pressed="density==='regular'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <button type="button" :class="{on: density==='large'}" @click="setDensity('large')" aria-label="גדול" title="שורות גדולות" :aria-pressed="density==='large'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 5h16M4 12h16M4 19h16"/></svg></button>
      </div>
    </div>

    <div class="filter-panel card" x-show="showFilters" x-transition.opacity>
      <label class="field"><span>פרויקט</span>
        <select @change="setFilter('project', $event.target.value ? +$event.target.value : null)">
          <option value="">הכל</option>
          <template x-for="p in boot.projects" :key="p.id"><option :value="p.id" :selected="filters.project===p.id" x-text="p.name_he"></option></template>
        </select></label>
      <label class="field"><span>אחראי</span>
        <select @change="setFilter('assignee', $event.target.value==='none' ? 'none' : ($event.target.value ? +$event.target.value : null))">
          <option value="">הכל</option>
          <template x-for="p in assignees()" :key="p.id"><option :value="p.id" :selected="filters.assignee===p.id" x-text="personLabel(p)"></option></template>
          <option value="none" :selected="filters.assignee==='none'">ללא אחראי</option>
        </select></label>
      <label class="field"><span>סטטוס</span>
        <select @change="setFilter('status', $event.target.value ? +$event.target.value : null)">
          <option value="">הכל</option>
          <template x-for="s in boot.statuses" :key="s.id"><option :value="s.id" :selected="filters.status===s.id" x-text="s.name_he"></option></template>
        </select></label>
      <label class="field"><span>מאת</span>
        <select @change="setFilter('requester', $event.target.value==='none' ? 'none' : ($event.target.value ? +$event.target.value : null))">
          <option value="">הכל</option>
          <template x-for="p in boot.people" :key="p.id"><option :value="p.id" :selected="filters.requester===p.id" x-text="personLabel(p)"></option></template>
          <option value="none" :selected="filters.requester==='none'">ללא שולח</option>
        </select></label>
      <label class="switch-row"><input type="checkbox" :checked="filters.group" @change="toggleGroup($event.target.checked)"><span>קבץ לפי פרויקט</span></label>
      <div class="btnrow fp-actions"><a class="btn small ghost" href="/archive" @click.prevent="go('/archive')">ארכיון</a><button class="btn small" @click="clearFilters()" :disabled="!activeChips().length">ניקוי הכל</button><button class="btn small ghost" @click="showFilters=false">סגירה</button></div>
    </div>

    <div class="active-chips" x-show="activeChips().length">
      <template x-for="c in activeChips()" :key="c.key">
        <button class="achip" @click="setFilter(c.key, null)"><span x-text="c.label"></span><span aria-hidden="true">×</span><span class="sr">הסרת סינון</span></button>
      </template>
    </div>

    <template x-if="tasks.length===0">
      <div class="empty"><b>אין משימות להצגה</b><span x-text="hasFilters() ? 'נסו לשנות או לנקות את הסינון' : 'הוסיפו את המשימה הראשונה בשורה שלמעלה'"></span></div>
    </template>

    <template x-for="sec in sections()" :key="sec.key">
    <div>
    <template x-if="sec.title"><div class="grp-h" :class="{unassigned: sec.def}" :style="'--pcol:'+sec.color"><i></i><span x-text="sec.title"></span><span class="n" x-text="sec.items.length"></span></div></template>
    <div class="rows" :class="{grouped: filters.group}">
      <template x-for="t in sec.items" :key="t.id">
        <div class="row" :class="{sel: route.id===t.id, urgent: t.priority_sort===1, overdue: isLate(t), unassigned: t.project_default, 'row-enter': enterId===t.id}" :style="'--pc:'+t.priority_color+';--pcol:'+pc(t)">
          <button class="check" @click="toggleDone(t, $event)" aria-label="סימון כהושלמה"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.5l4.2 4.2L18.5 7.8" pathLength="1"/></svg></i></button>
          <button class="body" @click="!t._bad && openTask(t.id)">
            <span class="plabel" :class="{unassigned: t.project_default}" :style="'--pcol:'+pc(t)"><i></i><span x-text="t.pending_project ? 'ממתין לאישור פרויקט' : t.project" :title="t.pending_project ? 'פרויקט מוצע: '+t.pending_project : ''"></span></span>
            <span class="title" x-text="t.title"></span>
            <span class="from" x-show="t.requester" x-text="'מאת '+t.requester"></span><span class="review-badge" x-show="t.needs_review" title="הבקרה האוטומטית מצאה פרט שדורש בדיקה">דורש בדיקה</span>
            <span class="dates">
              <span class="dt dt-recv"><span class="k">התקבל</span> <b x-text="fmtReceived(t)"></b></span>
              <span class="dt" :class="{late: isLate(t), none: !t.due_date}">
                <template x-if="t.due_date"><span><span class="k">עד</span> <em class="est" x-show="t.due_source==='estimated'" title="יעד משוער">~</em><b x-text="fmtDate(t.due_date)"></b></span></template>
                <template x-if="!t.due_date"><span class="nodue">ללא יעד — אלכס יקבע</span></template>
              </span>
            </span>
            <span class="meta">
              <span x-show="t.assignee && t.assignee_id !== ownerId()" x-text="t.assignee"></span>
              <template x-if="t.status && t.status !== 'חדש'"><span class="sdot" :style="'--c:'+t.status_color"><i></i><span x-text="t.status"></span></span></template>
            </span>
          </button>
        </div>
      </template>
    </div>
    </div>
    </template>
    <p class="arc-foot"><a href="/archive" @click.prevent="go('/archive')" x-text="'📦 ארכיון ('+(boot.archive_total || 0)+' משימות שהושלמו)'"></a></p>
  </section>

  <!-- task card -->
  <div class="divider divider-card" data-pane="card" role="separator" aria-orientation="vertical" aria-label="שינוי רוחב כרטיס המשימה" tabindex="0" title="גרירה לשינוי הרוחב, לחיצה כפולה לאיפוס"><span class="grip"><i></i><i></i><i></i></span></div>
  <section class="pane-card card" @dragenter="route.name==='task' && dragOver('card', $event)" @dragover="route.name==='task' && dragOver('card', $event)" @dragleave="dragLeave('card', $event)" @drop="route.name==='task' && dropOn('card', $event)" :class="{unassigned: detail && detail.project_default, hasproj: route.name==='task' && detail, 'drop-active': dropping==='card'}" :style="detail ? '--pcol:'+pc(detail) : ''" aria-label="כרטיס משימה">
    <div class="drop-overlay" x-show="dropping==='card'" x-cloak><span>שחרר כאן כדי לשלוח לאלכס עבור המשימה</span></div>
    <template x-if="route.name!=='task'">
      <div class="empty"><b>לא נבחרה משימה</b>בחרו משימה מהרשימה כדי לראות ולערוך אותה</div>
    </template>
    <template x-if="route.name==='task' && !detail">
      <div class="empty" x-text="detailError || 'טוען…'"></div>
    </template>
    <template x-if="route.name==='task' && detail">
      <div class="tcard">
        <div class="tc-top">
          <button type="button" class="plabel big pbtn" :class="{unassigned: detail.project_default}" :style="'--pcol:'+pc(detail)" @click="openPicker('project', $event)" title="פרויקט"><i></i><span x-text="detail.pending_project ? 'ממתין לאישור פרויקט «'+detail.pending_project+'»' : detail.project"></span></button>
          <span class="spacer"></span>
          <button class="icon-btn drawer-close" @click="closeTask()" aria-label="סגירת הכרטיס" title="סגירה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>

        <div class="tc-titlerow">
          <template x-if="ed!=='title'"><h2 class="tc-title" x-text="detail.title"></h2></template>
          <template x-if="ed==='title'"><textarea class="tc-title-edit" rows="2" :value="detail.title" x-init="$nextTick(()=>{$el.focus(); $el.style.height='auto'; $el.style.height=$el.scrollHeight+'px'})" @input="$el.style.height='auto';$el.style.height=$el.scrollHeight+'px'" @keydown.enter.prevent="$el.blur()" @keydown.escape.stop="ed=null" @blur="saveField('title', $event.target.value)"></textarea></template>
          <button class="ed-btn" x-show="ed!=='title'" @click="ed='title'" aria-label="עריכת כותרת" title="עריכת כותרת">✎</button>
        </div>

        <div class="review-bar" x-show="detail.needs_review"><span class="review-badge">דורש בדיקה</span> <span class="muted">יש פרט שהבקרה האוטומטית לא הצליחה להשלים (ראו תשומת לב).</span> <button class="btn small" @click="markReviewed(detail.id)">בדקתי</button></div>
        <div class="metaline">
          <button class="mi" @click="openPicker('requester', $event)" title="מאת"><span x-text="detail.requester ? 'מאת '+detail.requester : 'ללא שולח'" :class="{dim: !detail.requester}"></span></button>
          <span class="who-info" x-show="detail.requester_company || detail.requester_role || detail.requester_status==='partial'" :title="[detail.requester_role, detail.requester_company].filter(Boolean).join(' · ')" tabindex="0">
            <span x-text="'('+([detail.requester_role, detail.requester_company].filter(Boolean).join(' · ') || 'פרטים חלקיים')+')'"></span></span>
          <span class="sep">·</span>
          <button class="mi" @click="openPicker('received', $event)" title="תאריך קבלה"><span x-text="'התקבל '+shortStamp(detail.source_date || detail.created_at)"></span></button>
          <span class="sep">·</span>
          <button class="mi due" :class="{late: isLate(detail), dim: !detail.due_date}" @click="openPicker('due', $event)" title="תאריך יעד"><span x-text="detail.due_date ? 'עד '+shortDate(detail.due_date) : 'ללא יעד'"></span><em class="est" x-show="detail.due_source==='estimated'">משוער</em></button>
          <span class="sep">·</span>
          <button class="mi" @click="openPicker('assignee', $event)" title="אחראי"><span x-text="detail.assignee || 'ללא אחראי'" :class="{dim: !detail.assignee}"></span></button>
          <span class="sep">·</span>
          <button class="mi" @click="openPicker('status', $event)" title="סטטוס"><span class="sdot" :style="'--c:'+detail.status_color"><i></i><span x-text="detail.status"></span></span></button>
          <span class="sep">·</span>
          <button class="mi" @click="openPicker('priority', $event)" title="דחיפות"><span :class="{late: detail.priority_sort===1}" x-text="detail.priority"></span></button>
        </div>
        <div class="open-mail" x-show="mailList().length" x-data="{menu: false}" @click.outside="menu=false" @keydown.escape="menu=false">
          <span class="split-btn"><button class="btn small ghost mail-btn" @click="go('/email/'+mailList()[0].id)"><span aria-hidden="true">📧</span> פתיחת המייל</button><button class="btn small ghost mail-btn caret" x-show="mailList().length>1" @click="menu=!menu" :aria-expanded="menu" aria-haspopup="menu" aria-label="מיילים נוספים בקשר למשימה" title="מיילים נוספים">▾</button></span>
          <div class="mail-menu" role="menu" x-show="menu" x-cloak>
            <template x-for="m in mailList()" :key="m.id"><button role="menuitem" class="mail-menu-item" @click="menu=false; go('/email/'+m.id)"><b x-text="clipText(m.subject || 'ללא נושא', 60)"></b><span class="muted sm" x-text="m.date ? fmtDateTime(m.date) : ''"></span></button></template>
          </div>
        </div>

        <div class="tc-desc">
          <template x-if="ed!=='desc'">
            <div class="desc-view"><p class="desc-text" x-show="detail.description" x-text="detail.description"></p><p class="desc-empty" x-show="!detail.description">אין תיאור</p>
              <button class="ed-btn" @click="ed='desc'" aria-label="עריכת תיאור" title="עריכת תיאור">✎</button></div>
          </template>
          <template x-if="ed==='desc'">
            <div><textarea class="desc-edit" :value="detail.description" x-init="$nextTick(()=>{$el.focus(); $el.style.height='auto'; $el.style.height=($el.scrollHeight+4)+'px'})" @input="$el.style.height='auto';$el.style.height=($el.scrollHeight+4)+'px'" @keydown.escape.stop="ed=null" placeholder="תיאור המשימה…" x-ref="descEdit"></textarea>
              <div class="btnrow" style="margin-top:6px"><button class="btn small primary" @click="saveField('description', $refs.descEdit.value)">שמירה</button><button class="btn small" @click="ed=null">ביטול</button></div></div>
          </template>
        </div>

        <button class="btn small ghost" x-show="detail.protocol" @click="openProtocol(detail.protocol.protocol_id)" x-text="'מתוך פרוטוקול: '+(detail.protocol ? clipText(detail.protocol.title, 50) : '')"></button>
        <!-- the lower part of the card: 1) the emails, 2) drafts, 3) notes (what changed), 4) the conversation, 5) footer -->
        <section class="cs corr" data-sec="mail" x-show="mailCards().length">
          <h3 class="cs-h"><span>התכתבות</span><span class="cs-n" x-text="mailCards().length"></span></h3>
          <template x-for="c in mailCards()" :key="c.id">
            <article class="mail-card" :class="{'is-src': c.src}">
              <button type="button" class="corr-row" @click="go('/email/'+c.id)" :title="'פתיחת המייל: '+c.subject">
                <span class="mc-top"><b class="mc-from" x-text="c.from"></b><span class="rel" :class="c.relation" x-show="c.relation" x-text="relHe(c.relation)"></span><span class="mc-date" x-text="dayTime(c.date)" :title="fmtDateTime(c.date)"></span></span>
                <span class="mc-subj" dir="auto" x-text="c.subject"></span>
                <span class="c-sum" dir="auto" x-show="c.summary" x-text="c.summary"></span>
              </button>
              <div class="att-list" x-show="c.files.length">
                <template x-for="f in c.files" :key="f.id">
                  <div class="att-row" :title="f.summary ? '' : (f.chunks ? 'אלכס עדיין לא סיכם את הקובץ' : 'אין טקסט לקריאה בקובץ')"><span class="att-ic" x-text="fileIcon(f)"></span>
                    <span class="att-main"><b dir="auto" x-text="f.name"></b>
                      <span class="att-sum" x-show="f.summary" x-text="f.summary"></span></span>
                    <a class="att-open" :href="'/api/files/'+f.id+'/download?inline=1'" target="_blank" rel="noopener">פתיחה</a></div>
                </template>
              </div>
              <template x-if="c.src && detail.email">
                <details class="email-src">
                  <summary>המייל המקורי</summary>
                  <div class="es-head" x-html="mailHeadHtml(detail.email)"></div>
                  <div class="es-body" x-data="{open: false, mode: detail.email.has_html ? 'html' : 'text', remote: false}">
                    <div class="muted" x-show="detail.email.original_subject" x-text="'נושא: '+detail.email.original_subject"></div>
                    <div class="muted" x-show="detail.email.attachments.length" x-text="'קבצים מצורפים: '+detail.email.attachments.map(a=>a.filename).join(', ')"></div>
                    <div class="mailview in-card" x-show="detail.email.has_html">
                      <div class="mv-bar"><span class="seg"><button class="btn small ghost" :class="{on: mode==='html'}" @click="mode='html'">תצוגה מקורית</button><button class="btn small ghost" :class="{on: mode==='text'}" @click="mode='text'">טקסט</button></span>
                        <span class="mv-remote muted sm" x-show="mode==='html' && detail.email.remote_images && !remote">התמונות החיצוניות חסומות · <a href="#" @click.prevent="remote=true">הצג</a></span></div>
                      <iframe class="mv-frame" x-show="mode==='html'" :src="mode==='html' ? '/api/emails/'+detail.email.id+'/view'+(remote?'?remote=1':'') : 'about:blank'" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" title="המייל המקורי"></iframe>
                    </div>
                    <pre class="mailtext" x-show="mode==='text' || !detail.email.has_html" :class="{collapsed: !open}" dir="auto" x-text="open ? detail.email.body_clean : (detail.email.body_clean || '').split('\n').slice(0, 12).join('\n')"></pre>
                    <button class="btn small ghost" x-show="(mode==='text' || !detail.email.has_html) && (detail.email.body_clean || '').split('\n').length > 12" @click="open = !open" x-text="open ? 'הצג פחות' : 'הצג הכל'"></button>
                    <button class="btn small ghost" @click="go('/email/'+detail.email.id)">פתיחה בדף מלא</button>
                  </div>
                </details>
              </template>
            </article>
          </template>
          <div class="fb-bar" x-show="detail.source_email_id && (!detail.feedback_given || fb.fixes) && !fb.done" x-transition.opacity.duration.400ms x-init="fbReset()">
            <span class="muted sm">האם אלכס צדק כשפתח את המשימה הזו?</span>
            <button type="button" class="icon-btn" :class="{on: fb.sent==='up'}" @click="fbVote('task', detail.id, 'up')" aria-label="מועיל" title="מועיל">👍</button>
            <button type="button" class="icon-btn" :class="{on: fb.sent==='down' || fb.open}" @click="fb.open=true" aria-label="לא מועיל" title="לא מועיל">👎</button>
            <span class="muted sm" x-show="fb.sent && !fb.open">תודה, זה נשמר ומשפר את העיבוד.</span>
            <div class="fb-panel" x-show="fb.open" x-cloak>
              <div class="fb-chips"><template x-for="r in fbReasons" :key="r"><button type="button" class="chip" :class="{on: fb.reason===r}" @click="fb.reason=r" x-text="r"></button></template></div>
              <input type="text" x-model="fb.text" placeholder="הערה (לא חובה)" aria-label="הערה לא חובה">
              <div class="btnrow"><button class="btn small primary" @click="fbVote('task', detail.id, 'down')" :disabled="!fb.reason && !fb.text.trim()">שליחה</button><button class="btn small ghost" @click="fb.open=false">ביטול</button></div>
            </div>
            <div class="fb-fix" x-show="fb.fixes">
              <span class="muted sm">תיקון מיידי:</span>
              <button class="btn small" x-show="['לא משימה','משימה של מישהו אחר'].includes(fb.reason)" @click="fbFix('info')">הפוך למידע בלבד</button>
              <select x-show="fb.reason==='פרויקט שגוי'" @change="fbFix('project', $event.target.value)"><option value="">בחרו פרויקט…</option><template x-for="p in boot.projects.filter(p=>!p.is_default)" :key="p.id"><option :value="p.id" x-text="p.name_he"></option></template></select>
              <button class="btn small" x-show="fb.reason==='תאריך שגוי'" @click="openPicker('due', $event)">שינוי תאריך יעד</button>
              <span x-show="fb.reason==='כפילות'"><input type="number" x-model="fb.mergeInto" placeholder="מספר משימה" style="width:110px"> <button class="btn small" @click="fbFix('merge', fb.mergeInto)" :disabled="!fb.mergeInto">מזג לתוכה</button></span>
              <select x-show="fb.reason==='משימה של מישהו אחר'" @change="fbFix('assignee', $event.target.value)"><option value="">שייך ל…</option><template x-for="p in boot.people.filter(p=>p.role!=='assistant')" :key="p.id"><option :value="p.id" x-text="p.name_he"></option></template></select>
            </div>
          </div>
        </section>

        <section class="cs drafts" data-sec="drafts" x-show="detail.drafts && detail.drafts.filter(d=>d.status!=='בוטל').length">
          <h3 class="cs-h"><span>טיוטת תשובה</span><span class="cs-n" x-text="detail.drafts.filter(x=>x.status!=='בוטל').length"></span></h3>
          <template x-for="d in detail.drafts.filter(x=>x.status!=='בוטל')" :key="d.id">
            <div class="draft">
              <pre class="draft-text" dir="auto" x-text="d.text"></pre>
              <div class="btnrow"><button class="btn small primary" @click="copyDraft(d)">העתק</button><button class="btn small" @click="draftStatus(d,'בוטל')">ביטול</button>
                <span class="muted sm" x-show="d.status==='הועתק'">הועתק</span></div>
            </div>
          </template>
        </section>

        <section class="cs tc-notes" data-sec="notes" x-show="(detail.notes || []).length">
          <h3 class="cs-h"><span>הערות ועדכונים</span><span class="cs-n" x-text="(detail.notes || []).length"></span></h3>
          <ol class="tl">
            <template x-for="n in notesView()" :key="n.id">
              <li class="tl-item"><div class="tl-meta"><span x-text="dayTime(n.created_at)" :title="fmtDateTime(n.created_at)"></span><span x-show="n.author" x-text="' · '+n.author"></span></div><div class="tl-text" dir="auto" x-text="n.text"></div></li>
            </template>
          </ol>
          <button type="button" class="tc-more" x-show="notesView().length < (detail.notes || []).length" @click="unfold('notes:'+detail.id)" x-text="'עוד '+((detail.notes || []).length - notesView().length)+' הערות'"></button>
          <button type="button" class="tc-more" x-show="fold['notes:'+detail.id] && (detail.notes || []).length > 1" @click="refold('notes:'+detail.id)">הסתר הערות</button>
        </section>

        <section class="cs tchat" data-sec="chat">
          <h3 class="cs-h"><span>שיחה על המשימה</span><span class="cs-n" x-show="(detail.thread || []).length" x-text="(detail.thread || []).length"></span></h3>
          <p class="cs-empty muted sm" x-show="!(detail.thread || []).length && !busy()" x-text="'אפשר לשאול את '+assistantName()+' על המשימה, לבקש טיוטה או עדכון.'"></p>
          <div class="tc-feed" x-ref="tcfeed" x-show="(detail.thread || []).length || busy()" x-effect="detail && detail.thread && scrollTaskFeed()">
            <button type="button" class="tc-more" x-show="convHidden(detail.thread, 'task:'+detail.id)" @click="unfold('task:'+detail.id)" x-text="'הודעות קודמות ('+convHidden(detail.thread, 'task:'+detail.id)+')'"></button>
            <template x-for="{m, day, key} in convItems(detail.thread, 'task:'+detail.id)" :key="key">
              <div class="tc-item" :class="m.author">
                <div class="day-sep" x-show="day"><span x-text="day"></span></div>
                <div class="bubble tc-b" :class="m.author">
                  <div class="b-head"><span class="actor" :class="{claude: m.author==='claude'}" x-text="m.author==='claude' ? assistantName() : ownerName()"></span><span class="b-time" x-text="hm(m.created_at)" :title="fmtDateTime(m.created_at)"></span><span class="edited-mark" x-show="m.edited">נערך</span>
                    <span class="msg-act" x-show="!m.import_id" @click.outside="if(msgMenu===m.id) msgMenu=null"><button type="button" class="icon-btn msg-dots" @click.stop="msgMenu = (msgMenu===m.id ? null : m.id)" aria-label="פעולות להודעה" title="פעולות להודעה">⋯</button>
                      <span class="msg-menu" x-show="msgMenu===m.id" x-cloak><button type="button" x-show="m.author==='owner'" @click="startEdit(m)">ערוך</button><button type="button" @click="askDelete(m)">מחק</button></span></span></div>
                  <template x-if="editing && editing.id===m.id"><div class="msg-edit"><textarea class="edit-in" x-model="editing.text" rows="3" @keydown.enter="if(!$event.shiftKey && !$event.isComposing){ $event.preventDefault(); saveEdit(); }" @keydown.escape.stop="cancelEdit()" x-init="$nextTick(() => $el.focus())"></textarea><div class="muted sm">Enter לשמירה, Esc לביטול</div></div></template>
                  <details class="sup-reply" x-show="m.superseded && !(editing && editing.id===m.id)"><summary>תשובה קודמת (הוחלפה)</summary><div class="b-text" x-html="chatHtml(m.text, m.refs)"></div></details>
                  <div class="b-text" x-show="!m.superseded && !(editing && editing.id===m.id)" x-html="chatHtml(m.text, m.refs)" @click="chatClick($event)"></div>
                  <div class="b-files" x-show="m.files.length"><template x-for="f in m.files" :key="f.id"><a class="fchip" :href="'/api/files/'+f.id+'/download'" x-text="fileIcon(f)+' '+f.name"></a></template></div>
                </div>
              </div>
            </template>
            <div class="bubble claude thinking-b" x-show="busy()"><span class="dots"><i></i><i></i><i></i></span> <span x-text="assistantName()+' חושב…'"></span></div>
          </div>
          <div class="chips-files" x-show="chatFiles.length">
            <template x-for="f in chatFiles" :key="f.key"><span class="fchip up" :class="{err: f.error, done: f.done}"><span x-text="f.error ? '⚠️' : fileIcon(f)"></span><span class="fn" x-text="f.name"></span><button type="button" @click="cancelChip(f)" aria-label="הסרת קובץ">✕</button></span></template>
          </div>
          <form class="tc-form" @submit.prevent="sendTaskChat()">
            <button type="button" class="icon-btn" @click="$refs.fileinput_task.click()" aria-label="צירוף קובץ" title="צירוף קובץ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11l-9.2 9.2a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-9.2 9.2a2 2 0 0 1-3-3L15 7"/></svg></button>
            <input type="file" multiple class="sr" x-ref="fileinput_task" @change="attachFiles($event.target.files, {task: detail.id}); $event.target.value=''" tabindex="-1">
            <textarea x-model="tcText" rows="1" class="tc-in comp-input" :placeholder="'כתוב ל'+assistantName()+' על המשימה…'" :aria-label="'כתוב ל'+assistantName()+' על המשימה'" enterkeyhint="send" @input="autosize($event.target)"
              @keydown.enter="if(!$event.shiftKey && !$event.isComposing){ $event.preventDefault(); sendTaskChat(); }"></textarea>
            <button type="button" class="icon-btn" :class="{rec: listeningTask}" @click="toggleMic('task')" aria-label="הקלטה קולית" title="הקלטה קולית"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
            <button type="submit" class="btn primary" :disabled="tcSending || uploading() || (!tcText.trim() && !chatFiles.some(f => f.done))">שליחה</button>
          </form>
        </section>

        <footer class="cs cs-foot" data-sec="foot">
          <p class="stamps muted" x-show="detail.created_at"><span x-text="'נוצרה '+dayTime(detail.created_at)" :title="fmtDateTime(detail.created_at)"></span><span class="sep">·</span><span x-text="'עדכון אחרון '+dayTime(detail.updated_at || detail.created_at)" :title="fmtDateTime(detail.updated_at || detail.created_at)"></span></p>
          <div class="purge-row"><button type="button" class="linkbtn danger" @click="purgeDlg = {t: detail}">העבר לסל</button></div>
        </footer>
      </div>
    </template>
  </section>
</div>
</template>

<!-- ===== ACTIVITY ===== -->
<template x-if="route.name==='activity'">
<div class="activity-page">
  <div class="page-h"><h1>פעילות</h1></div>
    <template x-if="act && act.outbox && act.outbox.items.length">
    <section class="card">
      <h3>מיילים יוצאים (יומן ביקורת)</h3>
      <p class="muted sm" x-text="(act.outbox.settings.enabled ? 'שליחה פעילה' : 'שליחה מושבתת')+' · נשלחו היום '+act.outbox.settings.sent_today+' מתוך '+act.outbox.settings.daily_cap"></p>
      <template x-for="o in act.outbox.items" :key="'ob'+o.id">
        <div class="sm" style="padding:4px 0;border-top:1px solid var(--border,#e5e7eb)"><b x-text="'#'+o.id+' '+o.subject"></b> <span class="muted" x-text="'→ '+o.to"></span><br>
          <span class="muted" x-text="({draft:'טיוטה',pending:'ממתין לאישור',approved:'אושר, ממתין לשליחה',sending:'בשליחה',sent:'נשלח',failed:'נכשל',cancelled:'בוטל',expired:'פג תוקף'})[o.status]+(o.approved_via ? ' · אושר ב'+(o.approved_via==='telegram'?'טלגרם':'אתר')+' '+fmtDateTime(o.approved_at) : '')+(o.sent_at ? ' · נשלח '+fmtDateTime(o.sent_at) : '')+(o.error ? ' · '+o.error : '')"></span></div>
      </template>
    </section>
  </template>
  <template x-if="act">
  <div>
    <div class="card counter">
      <div><b x-text="act.today_runs"></b> הרצות של אלכס היום</div>
      <div class="days"><template x-for="d in act.days" :key="d.date"><span class="day" :title="dayOf(d.date)"><b x-text="d.count"></b><i x-text="dayShort(d.date)"></i></span></template></div>
    </div>
    <div class="card fb-stats" x-show="fbStats && fbStats.total>0">
      <h3>איכות העיבוד לפי המשוב שלך <span class="muted sm">· 30 ימים</span></h3>
      <template x-if="fbStats">
        <div>
          <div class="u-tot"><div class="u-box"><span class="muted">דיוק משימות (👍)</span><b x-text="fbStats.task_precision===null ? '-' : Math.round(fbStats.task_precision*100)+'%'"></b></div>
            <div class="u-box"><span class="muted">משוב כולל</span><b x-text="fbStats.up+' 👍 · '+fbStats.down+' 👎'"></b></div>
            <div class="u-box"><span class="muted">מה הכי משתבש</span><b x-text="fbStats.reasons.length ? fbStats.reasons[0].reason : '-'"></b></div></div>
          <div class="u-tbl"><div class="u-h" style="grid-template-columns:2fr 1fr 1fr"><span>שבוע</span><span>תיקונים (👎)</span><span>אישורים (👍)</span></div>
            <template x-for="w in fbStats.corrections_per_week" :key="w.w"><div class="u-r" style="grid-template-columns:2fr 1fr 1fr"><span x-text="dayOf(w.from_day)"></span><span x-text="w.down"></span><span x-text="w.up"></span></div></template></div>
          <div class="muted sm" x-show="fbStats.reasons.length" x-text="'סיבות: '+fbStats.reasons.map(r=>r.reason+' '+r.n).join(' · ')"></div>
        </div>
      </template>
    </div>
    <div class="card usage-panel" x-show="usage">
      <h3>שימוש <span class="muted sm">· העלות היא שווה ערך API (הערכה בלבד): המנוי עצמו הוא תשלום קבוע עם מגבלות שימוש</span></h3>
      <template x-if="usage">
      <div>
        <div class="u-tot">
          <template x-for="t in [['היום', usage.today], ['7 ימים', usage.week], ['30 ימים', usage.month]]" :key="t[0]">
            <div class="u-box"><span class="muted" x-text="t[0]"></span><b x-text="usd(t[1].cost)"></b>
              <i class="muted" x-text="t[1].runs+' הרצות · '+tok(t[1].input+t[1].output+t[1].cache_read+t[1].cache_write)+' טוקנים'"></i></div>
          </template>
        </div>
        <div class="u-chart" role="img" aria-label="עלות יומית שווה ערך API ב-30 הימים האחרונים">
          <template x-for="d in usage.daily" :key="d.day"><span class="u-bar" :title="dayOf(d.day)+': '+usd(d.cost)+' · '+d.runs+' הרצות'"><i :style="'height:'+usageBar(d)+'px'"></i></span></template>
        </div>
        <div class="u-range"><span class="muted sm">פירוט לפי:</span>
          <div class="seg2"><button :class="{on: usageDays===7}" @click="usageDays=7; loadUsage()">7 ימים</button><button :class="{on: usageDays===30}" @click="usageDays=30; loadUsage()">30 ימים</button></div></div>
        <div class="u-tbl">
          <div class="u-h"><span>סוג עבודה</span><span>הרצות</span><span>טוקנים</span><span>שווה ערך API</span><span>זמן ממוצע</span></div>
          <template x-for="r in usage.by_kind" :key="r.key"><div class="u-r"><span x-text="r.label"></span><span x-text="r.runs"></span><span x-text="tok(r.input+r.output+r.cache_read+r.cache_write)"></span><span x-text="usd(r.cost)"></span><span x-text="Math.round(r.avg_ms/1000)+' שנ׳'"></span></div></template>
        </div>
        <div class="u-tbl">
          <div class="u-h"><span>מודל</span><span>הרצות</span><span>טוקנים</span><span>שווה ערך API</span><span>זמן ממוצע</span></div>
          <template x-for="r in usage.by_model" :key="r.key"><div class="u-r"><span x-text="r.label"></span><span x-text="r.runs"></span><span x-text="tok(r.input+r.output+r.cache_read+r.cache_write)"></span><span x-text="usd(r.cost)"></span><span x-text="Math.round(r.avg_ms/1000)+' שנ׳'"></span></div></template>
        </div>
        <div x-show="usage.imports.length"><b class="sm">ייבוא יומי: עלות למייל</b>
          <template x-for="i in usage.imports" :key="i.id"><div class="u-r u-imp"><span x-text="dayOf(i.at)"></span><span x-text="i.emails+' מיילים'"></span><span x-text="i.runs+' הרצות'"></span><span x-text="usd(i.cost)"></span><span x-text="i.per_email===null ? '-' : usd(i.per_email)+' למייל'"></span></div></template></div>
        <p class="sm" :class="{warn: usage.rate_limit_events.month>0}">פגיעות במגבלת המנוי: <b x-text="usage.rate_limit_events.week"></b> ב-7 ימים, <b x-text="usage.rate_limit_events.month"></b> ב-30 ימים<span x-show="usage.rate_limit_events.backoff_until"> · עבודות הרקע מושהות עד <span x-text="fmtDateTime(usage.rate_limit_events.backoff_until)"></span></span>. <span class="muted">אם זה קורה לעיתים קרובות, כדאי לשקול מנוי גדול יותר.</span></p>
      </div>
      </template>
    </div>
    <template x-if="act.gate_stats && act.gate_stats.length">
      <div class="card gate-stats"><b>בקרת איכות (30 ימים)</b>
        <div class="muted sm">כל פעולה של אלכס נבדקת בקוד. כאן רואים באילו נושאים הוא מחליק, וכמה תוקנו אחרי שאלה.</div>
        <template x-for="g in act.gate_stats" :key="g.code"><div class="grow-row"><span x-text="g.label"></span><i class="muted" x-text="g.raised+' התגלו · '+g.resolved+' תוקנו · '+g.accepted+' נשארו לבדיקה'+(g.autofixed ? ' · '+g.autofixed+' הושלמו בקוד' : '')"></i></div></template>
      </div></template>
    <template x-if="act.runs.length===0 && act.loose.length===0"><div class="empty"><b>עדיין אין פעילות</b>כאן יוצגו הפעולות שאלכס ביצע, ואפשר לבטל כל אחת מהן</div></template>
    <template x-for="r in act.runs" :key="r.id">
      <div class="card run">
        <div class="run-h">
          <div class="run-t"><b x-text="fmtDateTime(r.started_at)"></b> <span class="muted" x-text="triggerHe(r.trigger)"></span> <span class="muted" x-show="r.duration_ms" x-text="'· '+Math.max(1,Math.round(r.duration_ms/1000))+' שניות'"></span> <span class="muted" x-show="r.model" dir="ltr" x-text="'· '+r.model+(r.effort ? ' / '+r.effort : '')"></span></div>
          <button class="btn small danger" x-show="runUndoable(r)" @click="undoRun(r)">בטל את כל ההרצה</button>
        </div>
        <div class="run-s" x-show="r.summary_he" x-text="r.summary_he"></div>
        <div class="run-e muted" x-show="r.edited_msg_id" x-text="'נערך ע״י '+ownerName()+' → הרצה חוזרת (הודעה '+r.edited_msg_id+')'"></div>
        <div class="run-e error" x-show="r.error" x-text="'שגיאה: '+(r.error==='interrupted' ? 'ההרצה נקטעה' : 'ההרצה נכשלה')"></div>
        <p class="muted" x-show="r.actions.length===0 && !r.error" style="margin:6px 0 0">לא בוצעו שינויים בנתונים</p>
        <div class="gate-run" x-show="r.gate && r.gate.length">
          <b>בקרת איכות</b>
          <template x-for="g in r.gate" :key="g.id"><div class="gate-row" :class="g.outcome"><span class="gdot"></span><span x-text="gateHe(g)"></span> <i class="muted" x-text="clipText(g.detail, 150)"></i></div></template>
        </div>
        <ul class="acts">
          <template x-for="a in r.actions" :key="a.id">
            <li :class="{undone: a.undone_at}">
              <div class="a-main"><span x-text="describeAction(a)"></span> <a href="#" class="a-label" x-show="a.label" @click.prevent="openAction(a)" x-text="clipText(a.label, 70)"></a></div>
              <button class="btn small" x-show="!a.undone_at && a.undoable" @click="undoAction(a)">בטל</button>
              <span class="muted a-state" x-show="a.undone_at">בוטל</span>
              <span class="muted a-state" x-show="!a.undone_at && !a.undoable" x-text="a.reason"></span>
            </li>
          </template>
        </ul>
      </div>
    </template>
    <template x-if="act.security && act.security.length">
      <div class="card run"><div class="run-h"><b>פעולות אבטחה</b></div>
        <ul class="acts"><template x-for="(a, i) in act.security" :key="'sec'+i"><li><div class="a-main"><span x-text="a.new_value"></span> <span class="muted sm" x-text="fmtDateTime(a.created_at)"></span></div></li></template></ul></div>
    </template>
    <template x-if="act.loose.length">
      <div class="card run"><div class="run-h"><b>פעולות ללא הרצה</b></div>
        <ul class="acts"><template x-for="a in act.loose" :key="a.id"><li :class="{undone: a.undone_at}"><div class="a-main"><span x-text="describeAction(a)"></span> <a href="#" class="a-label" x-show="a.label" @click.prevent="openAction(a)" x-text="clipText(a.label, 70)"></a></div>
          <button class="btn small" x-show="!a.undone_at && a.undoable" @click="undoAction(a)">בטל</button><span class="muted a-state" x-show="a.undone_at">בוטל</span></li></template></ul></div>
    </template>
  </div>
  </template>
</div>
</template>

<!-- ===== SEARCH ===== -->
<template x-if="route.name==='archive'">
<div class="archive-page">
  <div class="page-h"><h1>ארכיון</h1><button class="btn small ghost" @click="go('/')">חזרה לרשימה</button></div>
  <p class="muted sm">משימות שהושלמו או בוטלו, מהחדשות לישנות. כאן אפשר לחפש, לסנן ולפתוח משימה מחדש. החיפוש הכללי מוצא אותן רק עם "כולל ארכיון".</p>
  <form class="arc-filters" @submit.prevent="loadArchive()">
    <input type="search" x-model="arc.q" placeholder="חיפוש בארכיון" aria-label="חיפוש בארכיון" @input.debounce.400ms="loadArchive()">
    <select x-model="arc.project" @change="loadArchive()" aria-label="פרויקט"><option value="">כל הפרויקטים</option><template x-for="p in boot.projects" :key="p.id"><option :value="p.id" x-text="p.name_he"></option></template></select>
    <select x-model="arc.person" @change="loadArchive()" aria-label="אדם"><option value="">כל האנשים</option><template x-for="p in boot.people" :key="p.id"><option :value="p.id" x-text="p.name_he"></option></template></select>
    <label class="sm muted">מתאריך <input type="date" x-model="arc.from" @change="loadArchive()"></label><label class="sm muted">עד תאריך <input type="date" x-model="arc.to" @change="loadArchive()"></label>
  </form>
  <p class="muted sm" x-text="arc.total+' משימות בארכיון'+(arc.total>=1000 ? ' (מוצגות עד 1000)' : '')"></p>
  <div class="rows">
    <template x-for="t in arc.items" :key="t.id">
      <div class="row closed" :class="{unassigned: t.project_default}" :style="'--pcol:'+pc(t)">
        <button class="body" @click="openTask(t.id)">
          <span class="plabel" :class="{unassigned: t.project_default}" :style="'--pcol:'+pc(t)"><i></i><span x-text="t.pending_project ? 'ממתין לאישור פרויקט' : t.project" :title="t.pending_project ? 'פרויקט מוצע: '+t.pending_project : ''"></span></span>
          <span class="title" x-text="t.title"></span>
          <span class="meta"><span x-show="t.requester" x-text="'מאת '+t.requester"></span><span class="sdot" :style="'--c:'+t.status_color"><i></i><span x-text="t.status"></span></span><span class="muted" x-text="dayOf(t.done_at || t.updated_at)"></span></span>
        </button>
        <button class="btn small" @click="reopenTask(t)">פתח מחדש</button>
      </div>
    </template>
  </div>
  <p class="muted" x-show="!arc.items.length && !arc.loading">אין משימות בארכיון שמתאימות לסינון.</p>
  <button class="btn" x-show="arc.items.length < arc.total" @click="loadArchive(true)">עוד…</button>
</div>
</template>

<template x-if="route.name==='trash'">
<div class="bin-page">
  <div class="page-h"><h1>סל מחזור</h1><button class="btn small danger" x-show="bin.total" @click="emptyBin()" data-test="bin-empty">רוקן את הסל</button></div>
  <p class="muted sm" x-text="bin.days > 0 ? 'מה שנמחק נשמר כאן '+bin.days+' ימים ואז נמחק סופית. אפשר לשחזר כל פריט עם כל מה שהיה בו.' : 'מה שנמחק נשמר כאן עד שמוחקים אותו ידנית. אפשר לשחזר כל פריט עם כל מה שהיה בו.'"></p>
  <div class="bin-kinds" x-show="bin.total" role="tablist" aria-label="סוג">
    <button class="chip" :class="{on: !bin.kind}" @click="bin.kind=''" x-text="'הכל ('+bin.total+')'"></button>
    <template x-for="k in binKinds()" :key="k"><button class="chip" :class="{on: bin.kind===k}" @click="bin.kind=k" x-text="binKindPl(k)+' ('+bin.counts[k]+')'"></button></template>
  </div>
  <div class="bin-list">
    <template x-for="it in binItems()" :key="it.id">
      <div class="bin-row" data-test="bin-row">
        <div class="bin-main">
          <div class="bin-title" x-text="it.title"></div>
          <div class="bin-meta"><span class="bin-kind" :class="'k-'+it.kind" x-text="it.kind_he"></span><span x-text="'נמחק '+dayOf(it.deleted_at)"></span><span x-show="it.summary" x-text="it.summary"></span><span class="bin-left" :class="{soon: it.days_left !== null && it.days_left <= 3}" x-text="binLeftText(it)"></span></div>
        </div>
        <div class="bin-acts"><button class="btn small" @click="restoreBin(it)" data-test="bin-restore">שחזר</button><button class="btn small danger" @click="destroyBin(it)" data-test="bin-destroy">מחק סופית</button></div>
      </div>
    </template>
  </div>
  <p class="bin-empty muted" x-show="!bin.loading && !bin.total">הסל ריק. מה שנמחק יגיע לכאן ואפשר יהיה לשחזר אותו.</p>
</div>
</template>

<template x-if="route.name==='search'">
<div>
  <div class="page-h"><h1>חיפוש</h1></div>
  <form class="searchbox" @submit.prevent="runSearch()">
    <input type="search" x-model="sq.q" placeholder="חיפוש בכל המידע (לפחות שלוש אותיות)" aria-label="חיפוש" @input.debounce.400ms="runSearch()">
    <label class="switch-row sm"><input type="checkbox" x-model="sq.mailArchive" @change="runSearch()" data-test="sq-mail-archive"><span>כולל ארכיון</span></label>
    <label class="switch-row sm"><input type="checkbox" x-model="sq.archive" @change="runSearch()"><span>כולל משימות סגורות</span></label>
    <button class="btn primary" type="submit">חיפוש</button>
  </form>
  <div class="sfilters">
    <label class="field"><span>סוג</span><select x-model="sq.kind" @change="runSearch()">
      <option value="">הכל</option><option value="task">משימות</option><option value="email">מיילים</option><option value="chat">צ׳אט</option><option value="knowledge">מידע</option><option value="chunk,file">מסמכים</option><option value="note">הערות</option></select></label>
    <label class="field"><span>פרויקט</span><select x-model="sq.project" @change="runSearch()">
      <option value="">הכל</option><template x-for="p in boot.projects" :key="p.id"><option :value="p.id" x-text="p.name_he"></option></template></select></label>
    <label class="field"><span>אדם</span><input type="text" x-model="sq.person" @input.debounce.400ms="runSearch()" placeholder="שם"></label>
    <label class="field"><span>מתאריך</span><input type="text" inputmode="numeric" x-model="sq.from" @change="runSearch()" placeholder="יום/חודש/שנה"></label>
    <label class="field"><span>עד תאריך</span><input type="text" inputmode="numeric" x-model="sq.to" @change="runSearch()" placeholder="יום/חודש/שנה"></label>
  </div>
  <p class="error" x-show="sErr" x-text="sErr"></p>
  <p class="muted" style="font-size:.82rem;margin:0 0 8px" x-show="sem && sem.pending>0" x-text="'האינדקס החכם מתעדכן ברקע: '+(sem ? sem.pending : 0)+' פריטים ממתינים'"></p>
  <template x-if="sres && sres.results.length===0 && !sErr"><div class="empty"><b>לא נמצאו תוצאות</b>נסו מילים אחרות או חלק מהמילה</div></template>
  <template x-for="g in searchGroups()" :key="g.key">
    <div class="sgroup">
      <h2 class="sec-h" x-text="g.label+' ('+g.items.length+')'"></h2>
      <div class="sres-list">
        <template x-for="r in g.items" :key="r.key">
          <button class="sres" @click="openResult(r)">
            <span class="s-top"><span class="arch-chip" x-show="r.archived" title="מייל מהארכיון (לא עובד על ידי העוזר)">ארכיון</span><span class="plabel" :class="{unassigned: r.project_default}" x-show="r.project" :style="'--pcol:'+(r.project_default||!r.project_color ? '#6b7280' : r.project_color)"><i></i><span x-text="r.project"></span></span></span>
            <span class="s-title" x-show="r.title" x-text="r.title"></span>
            <span class="s-snip" x-html="r.html"></span>
            <span class="s-meta muted" x-text="[r.person, dayOf(r.date), r.via==='semantic' ? 'נמצא לפי משמעות' : ''].filter(Boolean).join(' · ')"></span>
          </button>
        </template>
      </div>
    </div>
  </template>
</div>
</template>

<!-- ===== MAIL: every email in one place (list + reading pane) ===== -->
<template x-if="route.name==='mail'">
<div class="split mail-split" :class="{'has-task': !!mail.openId}" data-test="mail-tab">
  <section class="pane-list mail-list" aria-label="רשימת מיילים" @scroll.passive="mailScrolled($event)">
    <div class="page-h" style="margin-bottom:8px"><h1>דואר</h1>
      <span class="muted sm" data-test="mail-count" x-text="mailSummary()"></span></div>
    <form class="mail-search" @submit.prevent="mailReload()">
      <input type="search" x-model="mail.f.q" placeholder="חיפוש בכל המיילים: נושא, תוכן, קבצים מצורפים" aria-label="חיפוש במיילים" data-test="mail-q" @input.debounce.400ms="mailReload()">
    </form>
    <div class="mail-bar">
      <span class="seg2" role="group" aria-label="תצוגה">
        <button type="button" :class="{on: mail.f.mode!=='all'}" @click="mailSet('mode','threads')" data-test="mode-threads">לפי שיחות</button>
        <button type="button" :class="{on: mail.f.mode==='all'}" @click="mailSet('mode','all')" data-test="mode-all">כל המיילים</button>
      </span>
      <span class="seg2" role="group" aria-label="תיקייה">
        <button type="button" :class="{on: mail.f.folder==='all'}" @click="mailSet('folder','all')">הכל</button>
        <button type="button" :class="{on: mail.f.folder==='in'}" @click="mailSet('folder','in')" data-test="folder-in">נכנס</button>
        <button type="button" :class="{on: mail.f.folder==='out'}" @click="mailSet('folder','out')" data-test="folder-out">יוצא</button>
      </span>
      <button type="button" class="btn small ghost mail-fbtn" :class="{on: mail.showF}" @click="mail.showF=!mail.showF" data-test="mail-filters-btn">סינון<span class="fcount" x-show="mailFilterCount()>0" x-text="mailFilterCount()"></span></button>
    </div>
    <div class="mail-filters" x-show="mail.showF" data-test="mail-filters">
      <label class="field"><span>פרויקט</span><select x-model="mail.f.project" @change="mailReload()" data-test="f-project">
        <option value="">הכל</option><template x-for="p in boot.projects" :key="p.id"><option :value="p.id" x-text="p.name_he"></option></template></select></label>
      <label class="field mf-person"><span>אדם (שולח או נמען)</span>
        <input type="text" x-model="mail.pq" placeholder="שם או כתובת" autocomplete="off" data-test="f-person" @input.debounce.250ms="mailPeople()" @focus="mailPeople()" @keydown.escape="mail.sug=[]">
        <span class="mf-chip" x-show="mail.f.person"><span x-text="mail.f.personName || mail.f.person"></span><button type="button" @click="mailPick(null)" aria-label="ניקוי">✕</button></span>
        <div class="mf-sug" x-show="mail.sug.length"><template x-for="p in mail.sug" :key="(p.id||'')+p.email"><button type="button" @click="mailPick(p)"><b x-text="p.name"></b> <span class="muted" dir="ltr" x-text="p.email"></span></button></template></div></label>
      <label class="field"><span>תקופה</span><select x-model="mail.range" @change="mailRange()" data-test="f-range">
        <option value="">הכל</option><option value="week">השבוע</option><option value="month">החודש</option><option value="year">השנה</option><option value="custom">בחירת תאריכים</option></select></label>
      <div class="mf-dates" x-show="mail.range==='custom' || mail.f.from || mail.f.to">
        <label class="field"><span>מתאריך</span><input type="date" x-model="mail.f.from" @change="mail.range='custom'; mailReload()" data-test="f-from"></label>
        <label class="field"><span>עד תאריך</span><input type="date" x-model="mail.f.to" @change="mail.range='custom'; mailReload()" data-test="f-to"></label>
      </div>
      <label class="field"><span>משימה</span><select x-model="mail.f.linked" @change="mailReload()" data-test="f-linked">
        <option value="">הכל</option><option value="1">מקושר למשימה</option><option value="0">לא מקושר למשימה</option></select></label>
      <div class="mf-checks">
        <label class="switch-row sm"><input type="checkbox" x-model="mail.f.att" @change="mailReload()" data-test="f-att"><span>עם קבצים מצורפים</span></label>
        <label class="switch-row sm"><input type="checkbox" :checked="mail.f.archive!=='0'" @change="mail.f.archive=$event.target.checked?'1':'0'; mailReload()" data-test="f-archive"><span>כולל ארכיון</span></label>
        <label class="switch-row sm"><input type="checkbox" :checked="mail.f.noise==='0'" @change="mail.f.noise=$event.target.checked?'0':''; mailReload()"><span>בלי דואר אוטומטי</span></label>
        <button type="button" class="btn small ghost" x-show="mailFilterCount()>0" @click="mailClearFilters()">נקה סינון</button>
      </div>
    </div>
    <p class="error" x-show="mail.err" x-text="mail.err"></p>
    <div class="mail-new" x-show="mail.newCount>0 && !mail.f.q" data-test="mail-new-note" x-text="mail.newCount+' מיילים חדשים מאז הביקור האחרון'"></div>
    <div class="mail-rows" data-test="mail-rows">
      <template x-for="m in mail.items" :key="m.id">
        <div class="mrow-wrap">
          <div class="mrow" :class="{sel: mail.openId===m.id, new: m.is_new, arch: m.archived}" tabindex="0" role="button" @click="mailOpen(m)" @keydown.enter="mailOpen(m)" :data-id="m.id">
            <span class="mdir" :class="m.direction" :title="m.direction==='sent' ? 'יוצא' : 'נכנס'" x-html="mailDirIcon(m.direction)"></span>
            <span class="mbody">
              <span class="mtop"><b class="mwho" x-text="mailWho(m)"></b><span class="mnew" x-show="m.is_new">חדש</span><span class="mdate" x-text="mailWhen(m.date)"></span></span>
              <span class="msubj" x-text="m.subject"></span>
              <span class="msnip" x-show="!m.snippet_html" x-text="m.snippet"></span><span class="msnip" x-show="m.snippet_html" x-html="m.snippet_html"></span>
              <span class="mchips">
                <span class="plabel" :class="{unassigned: m.project_default}" x-show="m.project" :style="'--pcol:'+(m.project_default||!m.project_color ? '#6b7280' : m.project_color)"><i></i><span x-text="m.project"></span></span>
                <span class="mclip" x-show="m.has_files" title="קבצים מצורפים" aria-label="קבצים מצורפים">📎</span>
                <span class="arch-chip" x-show="m.archived" title="מייל מהארכיון (לא עובד על ידי העוזר)">ארכיון</span>
                <span class="auto-chip" x-show="m.auto">אוטומטי</span>
                <span class="mvia" x-show="m.via==='attachment'" x-text="'נמצא בקובץ: '+(m.via_name||'')"></span>
                <button type="button" class="mtask" x-show="m.task" @click.stop="openTask(m.task.id)" :title="m.task ? m.task.title : ''" data-test="mail-task-badge">משימה</button>
                <button type="button" class="mcount" x-show="m.count>1" @click.stop="mailToggle(m)" :aria-expanded="!!mail.open[m.id]" data-test="mail-count-btn"><span x-text="(mail.open[m.id] ? '▾ ' : '▸ ')+m.count+' מיילים'"></span></button>
              </span>
            </span>
          </div>
          <div class="msub" x-show="mail.open[m.id]">
            <template x-for="t in (mail.sub[m.id] || [])" :key="t.id">
              <div class="mrow sub" :class="{sel: mail.openId===t.id, new: t.is_new}" tabindex="0" role="button" @click="mailOpen(t)" @keydown.enter="mailOpen(t)" x-show="t.id!==m.id">
                <span class="mdir" :class="t.direction" x-html="mailDirIcon(t.direction)"></span>
                <span class="mbody"><span class="mtop"><b class="mwho" x-text="mailWho(t)"></b><span class="mdate" x-text="mailWhen(t.date)"></span></span>
                  <span class="msnip" x-text="t.snippet"></span>
                  <span class="mchips"><span class="mclip" x-show="t.has_files">📎</span><span class="arch-chip" x-show="t.archived">ארכיון</span><button type="button" class="mtask" x-show="t.task" @click.stop="openTask(t.task.id)">משימה</button></span></span>
              </div>
            </template>
            <div class="muted sm msub-load" x-show="mail.open[m.id] && !mail.sub[m.id]">טוען…</div>
          </div>
        </div>
      </template>
    </div>
    <template x-if="!mail.loading && mail.loaded && mail.items.length===0 && !mail.err"><div class="empty" data-test="mail-empty"><b>לא נמצאו מיילים</b>נסו מילים אחרות או הסירו חלק מהסינון</div></template>
    <div class="mail-more" x-show="mail.next || mail.loading">
      <button type="button" class="btn small" x-show="mail.next && !mail.loading" @click="mailMore()" data-test="mail-more">טען עוד</button>
      <span class="muted sm" x-show="mail.loading">טוען…</span>
      <span class="sentinel" x-ref="msentinel"></span>
    </div>
    <p class="muted sm mail-cap" x-show="mail.capped">מוצגות 100 התוצאות הרלוונטיות ביותר. צמצמו את החיפוש כדי לראות את השאר.</p>
    <p class="muted sm mail-foot"><a href="/search" @click.prevent="go('/search'+(mail.f.q ? '?q='+encodeURIComponent(mail.f.q) : ''))">חיפוש בכל המידע (משימות, פרוטוקולים, מסמכים) ›</a></p>
  </section>

  <div class="divider divider-card" data-pane="mlist" role="separator" aria-orientation="vertical" aria-label="שינוי רוחב רשימת המיילים" tabindex="0" title="גרירה לשינוי הרוחב, לחיצה כפולה לאיפוס"><span class="grip"><i></i><i></i><i></i></span></div>
  <section class="pane-card card email-page mail-pane" aria-label="מייל" data-test="mail-pane">
    <template x-if="!mail.openId"><div class="empty"><b>לא נבחר מייל</b>בחרו מייל מהרשימה</div></template>
    <template x-if="mail.openId"><div x-html="emailTpl()"></div></template>
  </section>
</div>
</template>

<!-- ===== EMAIL (one markup, used by the full page /email/:id and by the reading pane of the mail tab) ===== -->
<template x-if="route.name==='email'">
<div class="email-page card" x-html="emailTpl()"></div>
</template>
<template id="tpl-email-view">
  <template x-if="!emailView"><div class="empty" x-text="emailErr || 'טוען…'"></div></template>
  <template x-if="emailView">
    <div>
      <button class="btn ghost" x-show="route.name==='email'" @click="history.length>1 ? history.back() : go('/mail')">‹ חזרה</button>
      <div class="em-grid"><div class="em-main">
      <h1 style="font-size:1.3rem;margin:8px 0" x-text="emailView.original_subject || emailView.subject"></h1>
      <div x-html="mailHeadHtml(emailView)"></div>
      <div class="arch-note" x-show="emailView.archive" data-test="arch-note"><span class="arch-chip">ארכיון</span> <span x-text="emailView.archive ? emailView.archive.note : ''"></span></div>
      <div class="muted" x-show="!emailView.archive" x-text="'התקבל במערכת: '+fmtDateTime(emailView.received_at)"></div>
      <div class="b-tasks" style="margin:10px 0" x-show="emailView.tasks.length"><template x-for="t in emailView.tasks" :key="t.id"><button class="tchip" @click="openTask(t.id)" x-text="'משימה '+t.id+': '+t.title"></button></template></div>
      <div class="mail-actions" data-test="mail-actions">
        <button class="btn small" x-show="!emailView.tasks.length" @click="mailChatAct('create')" data-test="act-create-task">צור משימה מהמייל</button>
        <button class="btn small" @click="mailChatAct('ask')" data-test="act-ask">שאל את אלכס על המייל</button>
        <button class="btn small ghost" @click="mailShowThread(emailView)" data-test="act-thread" x-show="emailView.thread_key" x-text="mailThreadOpen && mailThreadOpen.id===emailView.id ? 'הסתר את השיחה' : 'הצג את כל השיחה'"></button>
      </div>
      <div class="mail-thread" x-show="mailThreadOpen && mailThreadOpen.id===emailView.id" data-test="mail-thread">
        <div class="muted sm" x-show="mailThreadOpen && mailThreadOpen.loading">טוען…</div>
        <template x-for="t in (mailThreadOpen ? mailThreadOpen.items : [])" :key="t.id">
          <div class="mt-row" :class="{cur: t.id===emailView.id}" tabindex="0" role="button" @click="mailOpenId(t.id)" @keydown.enter="mailOpenId(t.id)">
            <span class="mdir" :class="t.direction" aria-hidden="true" x-html="mailDirIcon(t.direction)"></span>
            <b x-text="t.direction==='sent' ? 'אל: '+(t.to.join(', ')||'—') : t.from"></b>
            <span class="muted" x-text="fmtDateTime(t.date)"></span>
            <span class="arch-chip" x-show="t.archived">ארכיון</span>
          </div>
        </template>
      </div>
      <div class="mailview" x-data="{mode: emailView.has_html ? 'html' : 'text', remote: false}">
        <div class="mv-bar" x-show="emailView.has_html">
          <span class="seg"><button class="btn small ghost" :class="{on: mode==='html'}" @click="mode='html'">תצוגה מקורית</button><button class="btn small ghost" :class="{on: mode==='text'}" @click="mode='text'">טקסט</button></span>
          <span class="mv-remote muted sm" x-show="mode==='html' && emailView.remote_images && !remote">התמונות החיצוניות חסומות · <a href="#" @click.prevent="remote=true">הצג</a></span>
        </div>
        <iframe class="mv-frame" x-show="mode==='html' && emailView.has_html" :src="mode==='html' && emailView.has_html ? '/api/emails/'+emailView.id+'/view'+(remote?'?remote=1':'') : 'about:blank'" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" title="המייל המקורי"></iframe>
        <pre class="mailtext" dir="auto" x-show="mode==='text' || !emailView.has_html" x-text="emailView.body_text"></pre>
      </div>
      <div class="sect sc-chat email-chat" x-data x-init="scLoad('email:'+emailView.id)">
        <h3>שיחה עם <span x-text="assistantName()"></span> על המייל</h3>
        <div class="tc-feed sc-feed" x-show="scMsgs('email:'+emailView.id).length>0" x-effect="scMsgs('email:'+emailView.id).length && scScroll()">
          <button type="button" class="tc-more" x-show="convHidden(scMsgs('email:'+emailView.id), 'email:'+emailView.id)" @click="unfold('email:'+emailView.id)" x-text="'הודעות קודמות ('+convHidden(scMsgs('email:'+emailView.id), 'email:'+emailView.id)+')'"></button>
          <template x-for="{m, day, key} in convItems(scMsgs('email:'+emailView.id), 'email:'+emailView.id)" :key="key">
            <div class="tc-item" :class="m.author"><div class="day-sep" x-show="day"><span x-text="day"></span></div>
            <div class="bubble tc-b" :class="m.author">
              <div class="b-head"><span class="actor" :class="{claude: m.author==='claude'}" x-text="m.author==='claude' ? assistantName() : ownerName()"></span><span class="b-time" x-text="hm(m.created_at)" :title="fmtDateTime(m.created_at)"></span></div>
              <div class="b-text" x-html="chatHtml(m.text, m.refs)" @click="chatClick($event)"></div>
            </div></div>
          </template>
          <div class="bubble claude thinking-b" x-show="busy() && sc.waiting===('email:'+emailView.id)"><span class="dots"><i></i><i></i><i></i></span> <span x-text="assistantName()+' חושב…'"></span></div>
        </div>
        <form class="tc-form" @submit.prevent="scSend('email:'+emailView.id)">
          <textarea x-model="sc.text" rows="1" class="tc-in comp-input" :placeholder="'כתוב ל'+assistantName()+' על המייל…'" :aria-label="'כתוב ל'+assistantName()+' על המייל'" enterkeyhint="send" @input="autosize($event.target)"
            @keydown.enter="if(!$event.shiftKey && !$event.isComposing){ $event.preventDefault(); scSend('email:'+emailView.id); }"></textarea>
          <button type="submit" class="btn primary" :disabled="sc.sending || !sc.text.trim()">שליחה</button>
        </form>
      </div>
      </div>
      <aside class="em-aside" x-show="emailView.files.length"><h3>קבצים מצורפים</h3>
        <template x-for="f in emailView.files" :key="f.id">
          <div class="kitem em-file"><div class="ef-top"><span x-text="fileIcon(f)"></span> <b dir="auto" x-text="f.original_name"></b></div>
            <div class="muted k-m" x-text="[fmtSize(f.size), textStatusHe(f.text_status)].filter(Boolean).join(' · ')"></div>
            <div class="k-b" x-show="f.summary" x-text="f.summary"></div>
            <div class="ef-act" x-show="!f.discarded"><a class="btn small ghost" :href="'/api/files/'+f.id+'/download?inline=1'" target="_blank" rel="noopener">פתיחה</a><a class="btn small ghost" :href="'/api/files/'+f.id+'/download'" download>הורדה</a></div>
            <div class="muted sm only-outlook" x-show="f.discarded" data-test="only-outlook">הקובץ נמצא רק ב-Outlook</div></div>
        </template>
      </aside></div>
    </div>
  </template>
</template>

<!-- ===== PROJECTS (list + page side by side) ===== -->
<template x-if="route.name==='projects'">
<div class="split" :class="{'has-task': route.id}">

  <section class="pane-list proj-list" aria-label="רשימת פרויקטים">
    <div class="searchbar"><input type="search" x-model="projQ" placeholder="חיפוש פרויקט" aria-label="חיפוש פרויקט">
      <button class="btn newproj" @click="showNewProj=!showNewProj" title="פרויקט חדש" aria-label="פרויקט חדש"><span class="plus" aria-hidden="true">+</span><span class="lbl">פרויקט חדש</span></button></div>
    <form class="add-row" x-show="showNewProj" @submit.prevent="addProject()">
      <input type="text" x-model="newProject" placeholder="שם פרויקט חדש" aria-label="שם פרויקט חדש">
      <button class="btn primary" type="submit" :disabled="!newProject.trim()">הוספה</button>
    </form>
    <div class="rows">
      <template x-for="p in filteredProjects()" :key="p.id">
        <button class="prow" :class="{sel: route.id===p.id}" @click="openProject(p.id)">
          <span class="plabel" :class="{unassigned: p.is_default}" :style="'--pcol:'+pc({project_color:p.color, project_default:p.is_default})"><i></i><span x-text="p.name_he"></span></span>
          <span class="count" x-text="p.open_count" :title="'משימות פתוחות'"></span>
        </button>
      </template>
    </div>
  </section>

  <div class="divider divider-card" data-pane="plist" role="separator" aria-orientation="vertical" aria-label="שינוי רוחב רשימת הפרויקטים" tabindex="0" title="גרירה לשינוי הרוחב, לחיצה כפולה לאיפוס"><span class="grip"><i></i><i></i><i></i></span></div>
  <section class="pane-card card proj-page" aria-label="דף פרויקט">
    <template x-if="!route.id"><div class="empty"><b>לא נבחר פרויקט</b>בחרו פרויקט מהרשימה</div></template>
    <template x-if="route.id && !pp"><div class="empty" x-text="ppErr || 'טוען…'"></div></template>
    <template x-if="route.id && pp">
      <div class="pj" :style="'--pcol:'+pc({project_color:pp.project.color, project_default:pp.project.is_default})">
        <div class="tc-top">
          <button class="btn ghost back-btn" @click="go('/projects')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            חזרה לרשימה
          </button>
        </div>

        <!-- header: name, state, open tasks, actions -->
        <header class="pj-head">
          <span class="plabel big" :class="{unassigned: pp.project.is_default}" :style="'--pcol:'+pc({project_color:pp.project.color, project_default:pp.project.is_default})"><i></i><span x-text="pp.project.name_he"></span></span>
          <span class="pj-state" :class="'st-'+({'פעיל':'on','מושהה':'hold','סגור':'off'}[pp.project.status]||'on')" x-text="pp.project.status || 'פעיל'"></span>
          <span class="pj-open"><span x-text="pp.project.open_count"></span> <span class="po-w">משימות</span> פתוחות</span>
          <span class="spacer"></span>
          <button class="btn small" @click="filterByProject(pp.project.id)">משימות</button>
          <div class="menu-wrap">
            <button class="icon-btn" @click="toggleMenu($event)" aria-haspopup="dialog" :aria-expanded="menuOpen" aria-label="תפריט פרויקט" title="תפריט פרויקט"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
          </div>
        </header>

        <div class="pj-cols">
          <div class="pj-main">

            <!-- A. passport -->
            <section class="pj-card pj-pass" aria-labelledby="pj-pass-h">
              <div class="pj-ch"><h2 id="pj-pass-h">דרכון הפרויקט</h2><span class="pj-headline" x-show="pp.profile && pp.profile.headline" x-text="pp.profile && pp.profile.headline"></span></div>
              <template x-if="ed!=='summary'">
                <div class="pj-sum" :class="{open: pjSumOpen}">
                  <p x-show="pp.project.summary_he" x-text="pp.project.summary_he" @click="pjSumOpen=!pjSumOpen" :title="pjSumOpen ? '' : 'לחצו להצגה מלאה'"></p>
                  <p class="muted" x-show="!pp.project.summary_he">אין תקציר עדיין.</p>
                  <button class="ed-btn" @click="ed='summary'" aria-label="עריכת תקציר" title="עריכת תקציר">✎</button>
                </div>
              </template>
              <template x-if="ed==='summary'">
                <div class="pj-sum-edit"><textarea class="desc-edit" :value="pp.project.summary_he" x-init="$nextTick(()=>{$el.focus(); $el.style.height='auto'; $el.style.height=($el.scrollHeight+4)+'px'})" @input="$el.style.height='auto';$el.style.height=($el.scrollHeight+4)+'px'" @keydown.escape.stop="ed=null" x-ref="sumEdit" placeholder="מהות הפרויקט, מזמין, שלב, אנשי מפתח"></textarea>
                  <div class="btnrow"><button class="btn small primary" @click="saveSummary($refs.sumEdit.value); ed=null">שמירה</button><button class="btn small" @click="ed=null">ביטול</button></div></div>
              </template>
              <dl class="pj-kv">
                <template x-for="f in (pp.profile ? pp.profile.fields : [])" :key="f.field">
                  <div class="kv" :class="{unknown: !f.value, owner: f.by_owner, editing: pjIsEditing('field', f.field)}">
                    <dt x-text="f.label"></dt>
                    <template x-if="!pjIsEditing('field', f.field)">
                      <dd>
                        <button type="button" class="kv-val" @click="pjStartEdit('field', f.field, f.value)" :title="'עריכה: '+f.label" x-text="f.value ? pjFieldText(f) : 'לא ידוע'"></button>
                        <template x-if="f.value">
                          <span class="kv-meta">
                            <span x-text="fmtDate(f.as_of)"></span>
                            <a class="src" :class="'s-'+(f.by_owner ? 'owner' : f.source.type)" :href="f.by_owner ? null : (f.source.link || null)" :title="f.by_owner ? 'עודכן על ידי '+ownerName() : f.source.label" :aria-label="f.by_owner ? 'עודכן על ידי '+ownerName() : 'מקור: '+f.source.label" @click="srcClick($event, f.by_owner ? null : f.source)" x-html="srcIcon(f.by_owner ? 'owner' : f.source.type)"></a>
                            <span class="own" x-show="f.by_owner">תוקן ידנית</span>
                          </span>
                        </template>
                      </dd>
                    </template>
                    <template x-if="pjIsEditing('field', f.field)">
                      <dd>
                        <form class="kv-edit" @submit.prevent="pjSave()" @keydown.escape.stop="pjEdit=null">
                          <input type="text" x-model="pjEdit.value" :inputmode="f.kind==='int' ? 'numeric' : 'text'" :placeholder="f.hint" :aria-label="f.label" x-init="$nextTick(()=>$el.focus())">
                          <button class="btn small primary" type="submit">שמירה</button>
                          <button class="btn small" type="button" @click="pjEdit=null">ביטול</button>
                          <button class="btn small ghost danger" type="button" x-show="f.value" @click="pjEdit.value=''; pjSave()">ניקוי</button>
                        </form>
                      </dd>
                    </template>
                  </div>
                </template>
              </dl>
              <p class="pj-note muted">לחיצה על ערך פותחת תיקון. תיקון שלך מסומן, ואלכס לא דורס אותו.</p>
            </section>

            <!-- B. latest status per process -->
            <section class="pj-card pj-status" aria-labelledby="pj-st-h">
              <div class="pj-ch"><h2 id="pj-st-h">סטטוס אחרון</h2>
                <div class="menu-wrap pj-addproc" x-show="pjMissingProcesses().length">
                  <button class="btn small ghost" @click="pjAddProc = !pjAddProc" :aria-expanded="pjAddProc">+ תהליך</button>
                  <div class="pj-pop" x-show="pjAddProc" x-cloak @click.outside="pjAddProc=false">
                    <template x-for="s in pjMissingProcesses()" :key="s.process"><button type="button" @click="pjAddProc=false; pjStartEdit('status', s.process, '')" x-text="s.label"></button></template>
                  </div>
                </div>
              </div>
              <template x-if="!pjStatuses().length && !pjEdit">
                <p class="muted pj-empty">עוד אין סטטוס מתועד. אלכס יעדכן אותו מהמיילים ומהפרוטוקולים, ואפשר להוסיף כאן.</p>
              </template>
              <ul class="pj-procs">
                <template x-for="s in pjStatuses()" :key="s.process">
                  <li class="proc" :class="['p-'+s.process, {owner: s.by_owner}]">
                    <span class="proc-l" x-text="s.label"></span>
                    <template x-if="!pjIsEditing('status', s.process)">
                      <div class="proc-b">
                        <button type="button" class="proc-t" @click="pjStartEdit('status', s.process, s.value)" :title="'עריכה: '+s.label" x-text="s.value || '…'"></button>
                        <template x-if="s.value">
                          <span class="kv-meta">
                            <span x-text="fmtDate(s.as_of)"></span>
                            <a class="src" :class="'s-'+(s.by_owner ? 'owner' : s.source.type)" :href="s.by_owner ? null : (s.source.link || null)" :title="s.by_owner ? 'עודכן על ידי '+ownerName() : s.source.label" :aria-label="s.by_owner ? 'עודכן על ידי '+ownerName() : 'מקור: '+s.source.label" @click="srcClick($event, s.by_owner ? null : s.source)" x-html="srcIcon(s.by_owner ? 'owner' : s.source.type)"></a>
                          </span>
                        </template>
                      </div>
                    </template>
                    <template x-if="pjIsEditing('status', s.process)">
                      <form class="kv-edit" @submit.prevent="pjSave()" @keydown.escape.stop="pjEdit=null">
                        <input type="text" x-model="pjEdit.value" placeholder="שורה אחת: איפה זה עומד ומה הצעד הבא" :aria-label="s.label" x-init="$nextTick(()=>$el.focus())">
                        <button class="btn small primary" type="submit" :disabled="!pjEdit.value.trim()">שמירה</button>
                        <button class="btn small" type="button" @click="pjEdit=null">ביטול</button>
                        <button class="btn small ghost danger" type="button" x-show="s.value" @click="pjEdit.value=''; pjSave()" title="התהליך לא רלוונטי לפרויקט">הסרה</button>
                      </form>
                    </template>
                  </li>
                </template>
              </ul>
            </section>

            <!-- facts grouped by topic -->
            <section class="pj-card pj-facts" aria-labelledby="pj-f-h">
              <div class="pj-ch"><h2 id="pj-f-h">מידע על הפרויקט</h2><span class="pj-count" x-text="(pp.facts||[]).length"></span><span class="spacer"></span>
                <button class="btn small ghost" @click="openFactAdd()">+ נתון</button></div>
              <div class="pj-ftools">
                <input type="search" x-model="pjFq" @input.debounce.400ms="ppSearch.q=pjFq; searchInProject()" placeholder="חיפוש במידע ובפרויקט" aria-label="חיפוש במידע על הפרויקט">
                <button type="button" class="chip" :class="{on: pjHist}" x-show="(pp.facts_history||[]).length" @click="pjHist=!pjHist" :aria-pressed="pjHist" x-text="'היסטוריה ('+(pp.facts_history||[]).length+')'"></button>
              </div>
              <template x-if="!(pp.facts||[]).length"><p class="muted pj-empty">המידע מתמלא מהמיילים, מהקבצים ומהפרוטוקולים, ואפשר להוסיף נתון גם ידנית.</p></template>
