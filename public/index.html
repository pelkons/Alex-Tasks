                    <span class="sl-m"><span class="pri" :class="{urgent: t.priority_sort===1}" x-show="t.priority_sort===1">דחוף</span><span :class="{late: pjLate(t)}" x-text="t.due_date ? 'עד '+fmtDate(t.due_date)+(t.due_source==='estimated' ? ' (משוער)' : '') : 'ללא יעד'"></span><span x-show="t.assignee" x-text="'· '+t.assignee"></span></span>
                  </button></li>
                </template>
              </ul>
              <button class="btn small ghost pj-all" x-show="pp.tasks.length" @click="filterByProject(pp.project.id)" x-text="'כל המשימות ('+pp.tasks.length+')'"></button>
            </section>

            <section class="pj-card pj-prots" aria-labelledby="pj-p-h">
              <div class="pj-ch"><h2 id="pj-p-h">פרוטוקולים</h2><span class="pj-count" x-text="(pp.protocols||[]).length"></span></div>
              <template x-if="!(pp.protocols||[]).length"><p class="muted pj-empty">אין פרוטוקולים</p></template>
              <ul class="sl">
                <template x-for="p in (pp.protocols || []).slice(0, 5)" :key="p.id">
                  <li><button type="button" class="sl-row" @click="openProtocol(p.id)"><span class="sl-t" x-text="p.title"></span><span class="sl-m" x-text="[dayOf(p.meeting_at), p.open_actions ? p.open_actions+' פתוחים' : ''].filter(Boolean).join(' · ')"></span></button></li>
                </template>
              </ul>
            </section>

            <section class="pj-card pj-people" aria-labelledby="pj-pe-h">
              <div class="pj-ch"><h2 id="pj-pe-h">אנשי קשר בפרויקט</h2></div>
              <template x-if="!(pp.people||[]).length"><p class="muted pj-empty">עוד לא ידוע מי מעורב</p></template>
              <ul class="sl">
                <template x-for="pe in (pp.people || [])" :key="pe.id">
                  <li><button type="button" class="sl-row pe" @click="go('/people')"><span class="av" x-text="(pe.name_he||'?').trim().charAt(0)"></span><span class="sl-t" x-text="pe.name_he"></span><span class="sl-m" x-text="[pe.role_text, pe.company].filter(Boolean).join(' · ') || ' '"></span></button></li>

    <textarea x-model="sc.text" rows="1" class="tc-in comp-input" :placeholder="'כתוב ל'+assistantName()+' על היום הזה…'" :aria-label="'כתוב ל'+assistantName()+' על היום הזה'" enterkeyhint="send" @input="autosize($event.target)"
      @keydown.enter="if(!$event.shiftKey && !$event.isComposing){ $event.preventDefault(); scSend('day:'+calSel); }"></textarea>
    <button type="submit" class="btn primary" :disabled="sc.sending || !sc.text.trim()">שליחה</button>
  </form>
</div>
    </div>
  </div>
</div>

<template x-if="route.name==='settings'">

  <template x-if="st">

    <section class="card">

      <label class="switch-row"><input type="checkbox" :checked="st.shabbat" @change="saveSet({shabbat: $event.target.checked})"><span>שקט בשבת (שישי 16:00 עד מוצאי שבת 20:00)</span></label>
      <div class="two"><label class="field"><span>תחילת שעות שקט</span><input type="time" :value="st.quiet_start" @change="saveSet({quiet_start: $event.target.value})"></label>
        <label class="field"><span>סיום שעות שקט</span><input type="time" :value="st.quiet_end" @change="saveSet({quiet_end: $event.target.value})"></label></div>
      <p class="muted sm">בשעות שקט ובשבת לא נשלחים דוא״ל והודעות יזומות בטלגרם. הדוא״ל נשלח רק אליכם.</p>
    </section>

    <section class="card">
      <h3>יומן באאוטלוק</h3>
      <div class="copy-row"><input type="text" readonly :value="here(st.calendar_url)" dir="ltr" @focus="$event.target.select()" aria-label="קישור ליומן"><button class="btn" @click="copyText(here(st.calendar_url))">העתקה</button></div>
      <ol class="how"><li>באאוטלוק בחרו: הוספת לוח שנה</li><li>בחרו: מהאינטרנט</li><li>הדביקו את הקישור ואשרו</li></ol>
      <div class="btnrow"><button class="btn small" @click="copyText(st.calendar_url + '?only=tasks')">העתקת קישור למשימות בלבד</button><button class="btn small" @click="copyText(st.calendar_url + '?only=meetings')">העתקת קישור לפגישות בלבד</button></div>
      <p class="muted sm">אאוטלוק מעדכן יומנים מנויים לבד כל כמה שעות. הקישור סודי: מי שמחזיק בו יכול לראות את המשימות והפגישות.</p>
      <button class="btn small danger" @click="rotateCal()">יצירת קישור חדש (הקישור הישן יפסיק לעבוד)</button>
    </section>

    <section class="card">
      <h3>איך לייצא מיילים מ-Outlook (ייבוא יומי)</h3>
      <p class="muted sm">כל בוקר אפשר להעביר לאלכס את כל המיילים של אתמול, גם שהתקבלו וגם שנשלחו. אלכס מסנן כפילויות ורעש, מקבץ לשרשורים, פותח וסוגר משימות, ושולח סיכום אחד כשהוא מסיים.</p>
      <p><b>הדרך המומלצת: העברה כקובץ מצורף (Outlook קלאסי)</b></p>
      <ol class="how"><li>בתיקיית הדואר הנכנס סמנו את המיילים של אתמול (Ctrl+A בתצוגה של אתמול, או חיפוש <span dir="ltr">received:yesterday</span>)</li><li>לחצו <span dir="ltr">Ctrl+Alt+F</span> (העבר כקובץ מצורף)</li><li>בשדה "אל" כתבו את כתובת התיבה של העוזר ושלחו</li><li>אם Outlook אומר שההודעה גדולה מדי, שלחו בשניים או שלושה חלקים; אלכס מאחד אותם לייבוא אחד</li><li>חזרו על זה בתיקייה "פריטים שנשלחו" כדי שגם המיילים שכתבתם ייכנסו (חשוב: כך אלכס יודע מה כבר ענית והבטחת)</li></ol>
      <p class="muted sm">מייל עם יותר משלושה מיילים מצורפים נחשב לייבוא יומי. כשלא מגיעים חלקים חדשים כ-10 דקות, אלכס מתחיל לעבד, ובסוף שולח סיכום אחד.</p>
      <p><b>דרך חלופית: גרירה לצ׳אט</b></p>
      <ol class="how"><li>גררו את המיילים לתיקייה בשולחן העבודה (הם הופכים לקבצי msg; בקבוצות גדולות Outlook לא תמיד שומר את כולם)</li><li>סמנו את כל הקבצים וגררו אותם לחלון הצ׳אט (אפשר גם קובץ zip שלהם)</li></ol>
      <p><b>Outlook החדש:</b> ייצאו כקבצי eml וגררו לצ׳אט, או העבירו את המיילים כקבצים מצורפים לכתובת התיבה של העוזר.</p>
      <p class="muted sm">מעל שלושה קבצי מייל בצ׳אט, או הודעה שכוללת "ייבוא יומי", מופיע כרטיס אחד עם התקדמות במקום הודעה לכל קובץ.</p>
    </section>

    <section class="card">
      <h3>תקציב יומי: עבודה לא דחופה בלבד</h3>
      <label class="field"><span>תקרה רכה ביום ($ שווה ערך API; 0 = כבוי, ברירת המחדל)</span><input type="number" min="0" step="1" :value="st.daily_budget_usd" @change="saveSet({daily_budget_usd: $event.target.value})"></label>
      <p class="muted sm">היום נוצלו <b x-text="usd(st.spent_today_usd)"></b>. כשהתקרה מושגת נדחית רק עבודה לא דחופה (סיכום זיכרון שבועי, השלמות, חילוץ עובדות מלידיעה בלבד), עד 24 שעות. משימות, דואר שוטף, שרשורי ייבוא, צ׳אט ותזכורות לעולם לא נדחים. בנוסף תקבלו התראה אם ההוצאה היומית גבוהה פי 2 מהממוצע.</p>
    </section>

    <section class="card health-card" x-init="loadSysHealth()">
      <h3>מצב המערכת</h3>
      <p class="muted sm">בדיקה מלאה כל 15 דקות, כולל פתיחה אמיתית של האתר בדפדפן. תקלה אדומה מדווחת לך פעם אחת, ושוב כשהיא חוזרת לתקין.</p>
      <template x-if="sysHealth">
        <div>
          <p><b x-text="sysHealth.summary || 'עדיין לא רצה בדיקה'"></b></p>
          <template x-for="c in sysHealth.checks" :key="c.id">
            <div class="hc-row sm"><span class="hc-dot" :class="c.status" :title="c.status"></span><b x-text="c.label"></b> <span class="muted" x-text="c.message"></span> <span class="muted hc-t" x-text="fmtDateTime(c.at)"></span></div>
          </template>
        </div>
      </template>
    </section>

    <section class="card ob-set" x-init="loadOutbox()">
      <h3>שליחת מיילים</h3>
      <p class="muted sm">העוזר מכין טיוטות בלבד. שום מייל לא יוצא מהחשבון שלך בלי שתאשר את הנוסח המדויק בכרטיס (כפתור ✅ בצ׳אט או בטלגרם), והשליחה עצמה נעשית מה-Outlook במחשב MAINPC.</p>

        <div>

          <div class="btnrow"><button class="btn" :class="obSet.enabled ? 'danger' : 'primary'" @click="obToggle()" x-text="obSet.enabled ? 'השבת שליחה' : 'הפעל שליחה'"></button>
            <label class="sm">מגבלה יומית <input type="number" min="1" max="500" style="width:5em" x-model.number="obSet.daily_cap" @change="obSetCap()"></label></div>
          <p class="muted sm" x-text="'כתובת שולח: '+(obSet.from || 'לא הוגדרה')+(obSet.signature_set ? ' · חתימה מוגדרת' : ' · ללא חתימה (המייל יוצא בשמך)')"></p>
        </div>

          <template x-for="d in ingest.mail.per_day" :key="d.day"><div class="muted sm" x-text="fmtDate(d.day)+': '+d.received+' התקבלו, '+d.stored+' חדשים'"></div></template>

    <section class="card cn-card" x-init="loadConnector()">

      <p class="muted sm" x-show="cn.latest && !cn.latest.version">עדיין לא הועלתה תוכנה להורדה.</p>
      <template x-if="cn.code">
        <div class="cn-code">
          <div class="copy-row"><input type="text" readonly :value="cn.code.connect_string" dir="ltr" @focus="$event.target.select()" aria-label="קוד חיבור"><button class="btn" @click="copyText(cn.code.connect_string)">העתקה</button></div>

    <section class="card bk-card" x-init="loadBackup()">
      <h3>גיבוי והצפנה</h3>
      <p class="muted sm">כל המידע במערכת מוצפן בדיסק. כל לילה נשמר גיבוי מוצפן נוסף ב-Proton Drive. בלי מפתח ההצפנה אי אפשר לשחזר את הנתונים מאף גיבוי.</p>
      <template x-if="bk.st">
        <div class="stor bk-stat">
          <div><span>גיבוי מקומי אחרון</span><b x-text="bk.st.local.last_at ? fmtDateTime(bk.st.local.last_at) : 'אין'"></b></div>
          <div><span>גיבוי אחרון ל-Proton Drive</span><b x-text="bk.st.offsite.last_success_at ? fmtDateTime(bk.st.offsite.last_success_at) : (bk.st.offsite.configured ? 'עדיין לא הצליח' : 'עדיין לא הופעל')"></b></div>
          <div><span>תוצאה אחרונה</span><b :class="{'bk-bad': bk.st.offsite.last_ok === false}" x-text="bk.st.offsite.configured ? (bk.st.offsite.last_ok ? 'הצליח' + (bk.st.offsite.last_run_at ? ' · ' + fmtDateTime(bk.st.offsite.last_run_at) : '') : 'נכשל: ' + (bk.st.offsite.last_error || '')) : 'לא רץ עדיין'"></b></div>
          <div><span>מקום בתיקיית Proton</span><b x-text="bk.st.offsite.remote_bytes != null ? fmtGB(bk.st.offsite.remote_bytes) : 'לא ידוע'"></b></div>
          <div><span>עותקי מסד נתונים ב-Proton</span><b x-text="bk.st.offsite.copies != null ? bk.st.offsite.copies : 'לא ידוע'"></b></div>
        </div>
      </template>
      <div class="bk-key-area">
        <div class="btnrow" x-show="!bk.key && !bk.ask"><button class="btn" @click="bk.ask = true; bk.err = ''; $nextTick(() => $refs.bkpw && $refs.bkpw.focus())">הצג מפתח הצפנה</button></div>
        <form x-show="bk.ask && !bk.key" @submit.prevent="bkShow()" class="bk-form">
          <label class="field"><span>הקלידו שוב את סיסמת האתר</span>

    <section class="card filters-card">
      <h3>סינון מיילים</h3>

          <b dir="auto" x-text="f.pattern"></b>
          <span class="muted sm" x-show="f.project" x-text="'· '+f.project"></span>
          <span class="fa" x-text="f.action_he"></span>
          <span class="muted sm" x-text="f.hits+' פגיעות'"></span>
          <button class="btn small ghost" @click="toggleFilter(f)" x-text="f.enabled ? 'השבת' : 'הפעל'"></button>
          <button class="icon-btn" @click="deleteFilter(f)" aria-label="מחיקת כלל" title="מחיקה">✕</button>

        <input type="text" x-model="fform.pattern" :placeholder="{sender:'name@example.com', domain:'example.com', text:'למשל: Out of office', regex:'^(RE|FW):'}[fform.kind]" dir="auto" aria-label="תבנית">
        <select x-model="fform.action" aria-label="פעולה"><option value="skip">לדלג (רק לשמור)</option><option value="fyi">לידיעה בלבד</option><option value="relevant">תמיד רלוונטי</option></select>

    <section class="card" x-show="st && st.urls">
      <h3>כתובות האתר</h3>
      <div class="copy-row"><span class="muted" style="min-width:5.5em">ראשית</span><input type="text" readonly :value="st.urls.main" dir="ltr" @focus="$event.target.select()" aria-label="כתובת ראשית"><button class="btn" @click="copyText(st.urls.main)">העתקה</button></div>
      <div class="copy-row" x-show="st.urls.mirror"><span class="muted" style="min-width:5.5em">מהעבודה</span><input type="text" readonly :value="st.urls.mirror" dir="ltr" @focus="$event.target.select()" aria-label="כתובת מהעבודה"><button class="btn" @click="copyText(st.urls.mirror)">העתקה</button></div>
      <p class="muted sm">הכתובת "מהעבודה" היא מראה של האתר לרשתות שחוסמות את הכתובת הראשית. הקישורים באתר נשארים על הכתובת שבה אתם משתמשים כרגע.</p>
      <label class="linkcheck" x-show="st.urls.mirror"><input type="checkbox" :checked="st.links_use_mirror" @change="saveSet({links_use_mirror: $event.target.checked})"> קישורים בטלגרם, במייל וביומן דרך כתובת "מהעבודה" (ברירת מחדל: הראשית)</label>
    </section>

    <section class="card" x-show="st && st.agent">
      <h3>המוח של אלכס</h3>
      <p class="muted sm">אלכס עובד דרך תוכנת סוכן שכבר מותקנת אצלך ומחוברת לחשבון שלך (Claude Code, Codex או Gemini CLI). המערכת רק מפעילה את התוכנה הרשמית, בלי לגעת בפרטי ההתחברות.</p>
      <label class="field"><span>סוכן</span>
        <select :value="st.agent.name" @change="saveSet({agent_provider: $event.target.value})">
          <template x-for="o in st.agent.options" :key="o.name"><option :value="o.name" :selected="o.name===st.agent.name" x-text="o.label+(o.ready ? '' : ' (לא מותקן)')"></option></template>
        </select></label>
      <label class="field"><span>מודל (אופציונלי, ריק = ברירת המחדל של הסוכן)</span><input type="text" dir="ltr" :value="st.agent.model" @change="saveSet({agent_model: $event.target.value})"></label>
      <h4 style="margin:10px 0 4px">מודל ורמת מאמץ לכל סוג עבודה</h4>
      <p class="muted sm">ברירת המחדל sonnet/medium. עבודות קצרות (למשל הודעת דופק) אפשר להריץ על מודל קטן וזול יותר. ריק = ברירת המחדל של הסוכן. הערכים מועברים לסוכן כמו שהם.</p>
      <template x-for="m in st.agent.models" :key="m.job">
        <div class="model-row"><span x-text="m.label"></span>
          <input type="text" dir="ltr" placeholder="מודל" :value="m.model" @change="saveModel(m.job, 'model', $event.target.value)">
          <input type="text" dir="ltr" placeholder="מאמץ" :value="m.effort" @change="saveModel(m.job, 'effort', $event.target.value)"></div>
      </template>
      <template x-for="o in st.agent.options.filter(x => x.name===st.agent.name)" :key="o.name"><p class="muted sm" x-text="(o.ready ? '✔ ' : '✖ ')+o.setup"></p></template>
    </section>

    <section class="card">
      <h3>מצב המערכת</h3>
      <template x-if="health">
        <div class="health">
          <template x-for="c in health.components" :key="c.id">
            <div class="hrow"><span class="dot" :class="c.ok ? 'ok' : 'bad'"></span><span x-text="c.label"></span><i class="muted" x-text="c.detail"></i></div>
          </template>
        </div>
      </template>
      <p class="muted sm">נבדק אוטומטית כל 5 דקות. שירות שנופל מופעל מחדש פעם אחת, ואם הבעיה נמשכת תגיע אליך הודעה.</p>
    </section>

    <section class="card">
      <h3>אחסון</h3>
      <template x-if="storage">
        <div class="stor">
          <div><span>דיסק השרת</span><b x-text="fmtGB(storage.disk_free)+' פנויים מתוך '+fmtGB(storage.disk_total)+' ('+storage.disk_free_pct+'%)'"></b></div>
          <div><span>קבצים (ארכיון)</span><b x-text="fmtGB(storage.files)"></b></div>
          <div><span>מסד נתונים ויומני הרצה</span><b x-text="fmtGB(storage.data)"></b></div>
          <div><span>גיבויים</span><b x-text="fmtGB(storage.backups)"></b></div>
          <div><span>מודלים</span><b x-text="fmtGB(storage.models)"></b></div>
        </div>
      </template>
      <label class="field"><span>גודל קובץ מרבי להעלאה (מ״ב)</span><input type="number" min="1" max="4096" :value="st.max_file_mb" @change="saveSet({max_file_mb: $event.target.value})"></label>
      <p class="muted sm">קבצים גדולים עולים באתר בחלקים ואפשר להמשיך אחרי ניתוק. את הטקסט של קבצים ענקיים קוראים ברקע ובמגבלה (למשל 300 העמודים הראשונים של PDF), ווידאו ואודיו נשמרים בלי אינדקס. בטלגרם המגבלה היא <span x-text="st.telegram_max_mb >= 1000 ? '2 ג״ב' : '20 מ״ב'"></span>.</p>
      <label class="field"><span>השמר בתיבה (ימים)</span><input type="number" min="1" max="3650" :value="st.mailbox_keep_days" @change="saveSet({mailbox_keep_days: $event.target.value})"></label>
      <p class="muted sm">מיילים שטופלו ונשמרו אצלנו במלואם (כולל הקבצים המצורפים) נמחקים מתיבת הדוא״ל של המערכת אחרי מספר הימים הזה. קבצים בארכיון לא נמחקים אוטומטית. הניקוי רץ בכל לילה.</p>
    </section>

    <section class="card">
      <h3>כתובות דוא״ל מורשות</h3>
      <textarea x-model="allowText" rows="3" dir="ltr" style="min-height:84px" aria-label="כתובות מורשות"></textarea>
      <p class="muted sm">מיילים מהכתובות האלה (או מועברים ממנה) נקלטים. כתובת בכל שורה או מופרדות בפסיק.</p>
      <button class="btn primary" @click="saveSet({email_allowlist: allowText})">שמירה</button>
    </section>

    <section class="card">
      <h3>סטטוסים ודחיפויות</h3>
      <div class="ren-list">
        <template x-for="s in st.statuses" :key="'s'+s.id"><div class="ren"><span class="dot" :style="'background:'+s.color"></span><input type="text" :value="s.name_he" @change="renameItem('statuses', s, $event.target.value)" aria-label="שם סטטוס"></div></template>
      </div>
      <div class="ren-list" style="margin-top:10px">
        <template x-for="s in st.priorities" :key="'p'+s.id"><div class="ren"><span class="dot" :style="'background:'+s.color"></span><input type="text" :value="s.name_he" @change="renameItem('priorities', s, $event.target.value)" aria-label="שם דחיפות"></div></template>
      </div>
      <p class="muted sm">שינוי שם חל מיד על כל המשימות.</p>
    </section>

    <section class="card">
      <h3>שינוי סיסמה</h3>
      <form @submit.prevent="changePassword()" class="pw-form">
        <input type="password" x-model="pw.old" autocomplete="current-password" placeholder="הסיסמה הנוכחית" aria-label="הסיסמה הנוכחית">
        <input type="password" x-model="pw.new" autocomplete="new-password" placeholder="סיסמה חדשה (לפחות 12 תווים)" aria-label="סיסמה חדשה">
        <button class="btn primary" type="submit" :disabled="!pw.old || pw.new.length < 12">שינוי סיסמה</button>
      </form>
      <p class="muted sm">לאחר שינוי הסיסמה יש להתחבר מחדש בשאר המכשירים.</p>
    </section>

    <section class="card">
      <h3>טלגרם</h3>
      <p x-text="st.telegram.bound ? 'הבוט מחובר ועונה רק לכם.' : (st.telegram.configured ? 'הבוט הוגדר וממתין לחיבור. החיבור נעשה פעם אחת בקישור חד־פעמי שמייצר מנהל המערכת.' : 'הבוט עדיין לא הוגדר. לאחר יצירת בוט וקבלת טוקן יש לפנות למנהל המערכת להפעלה.')"></p>
      <button class="btn small danger" x-show="st.telegram.bound" @click="unbindTelegram()">ניתוק הבוט</button>
    </section>
  </div>
  </template>
</div>
</template>

<!-- ===== PEOPLE ===== -->
<template x-if="route.name==='people'">
<div>
  <div class="page-h"><h1>אנשים</h1></div>
  <form class="add-row" @submit.prevent="addPerson()">
    <input type="text" x-model="newPerson.name" placeholder="שם" aria-label="שם">
    <input type="email" x-model="newPerson.email" placeholder="כתובת דוא״ל (אופציונלי)" aria-label="כתובת דוא״ל" style="direction:ltr;text-align:right">
    <select x-model="newPerson.role" aria-label="תפקיד"><option value="contact">איש קשר</option><option value="pm">מנהל פרויקט</option></select>
    <button class="btn primary" type="submit" :disabled="!newPerson.name.trim()">הוספה</button>
  </form>
  <template x-for="grp in peopleGroups()" :key="grp.title">
    <div>
      <h2 class="sec-h" x-text="grp.title"></h2>
      <div class="grid-list">
        <template x-for="p in grp.items" :key="p.id">
          <div class="card item">
            <div class="item-h">
              <div class="name"><span x-text="personLabel(p)"></span>
                <span class="sub" x-text="roleLabel(p.role)+' · '+openCountFor(p)+' משימות פתוחות'"></span></div>
              <button class="btn small" @click="filterByAssignee(p.id)" x-show="p.role!=='contact'">משימות</button>
              <button class="btn small" @click="toggleEdit('u'+p.id, p)" x-text="editing==='u'+p.id ? 'סגירה' : 'עריכה'"></button>
            </div>
            <div class="partial-line" x-show="p.status==='partial'"><span class="pbadge">חלקי</span> <span class="muted" x-text="p.missing.length ? 'חסר: '+p.missing.join(', ') : 'פרטים חלקיים'"></span></div>
            <div class="muted" style="font-size:.88rem;margin-top:2px" x-show="p.company || p.role_text" x-text="[p.role_text, p.company].filter(Boolean).join(' · ')"></div>
            <div class="muted" style="font-size:.88rem;margin-top:4px" x-show="p.notes" x-text="p.notes"></div>
            <button class="btn small" style="margin-top:6px" @click="togglePersonCard(p)" x-text="personCard && personCard.id===p.id ? 'הסתר פירוט' : 'אזכורים ומשימות'"></button>
            <template x-if="personCard && personCard.id===p.id">
              <div class="pcard">
<div class="sect sc-chat" x-data x-init="scLoad('person:'+p.id)">
  <h3>שיחה עם <span x-text="assistantName()"></span> על איש הקשר</h3>
  <div class="tc-feed sc-feed" x-show="scMsgs('person:'+p.id).length>0" x-effect="scMsgs('person:'+p.id).length && scScroll()">
    <template x-for="m in scMsgs('person:'+p.id)" :key="m.id">
      <div class="bubble tc-b" :class="m.author">
        <div class="b-head"><span class="actor" :class="{claude: m.author==='claude'}" x-text="m.author==='claude' ? assistantName() : ownerName()"></span> <span x-text="fmtDateTime(m.created_at)"></span></div>
        <div class="b-text" x-show="!m.confirm" x-html="chatHtml(m.text, m.refs)"></div>
        <div class="cf-card" x-show="m.confirm" x-cloak>
          <p class="b-text" x-text="m.confirm ? m.confirm.text : ''"></p>
          <div class="btnrow" x-show="m.confirm && m.confirm.status==='open'"><button class="btn danger" @click="answerConfirm(m, true)">כן, למחוק</button><button class="btn" @click="answerConfirm(m, false)">לא</button></div>
          <p class="muted sm" x-show="m.confirm && m.confirm.status==='no'">בסדר, לא נמחק.</p>
          <p class="muted sm" x-show="m.confirm && m.confirm.status==='failed'" x-text="m.confirm && m.confirm.result ? m.confirm.result.error : ''"></p>
          <p class="sm" x-show="m.confirm && m.confirm.status==='yes'"><b>נמחק לצמיתות.</b></p>
        </div>
      </div>
    </template>
    <div class="bubble claude thinking-b" x-show="busy() && sc.waiting===('person:'+p.id)"><span class="dots"><i></i><i></i><i></i></span> <span x-text="assistantName()+' חושב…'"></span></div>
  </div>
  <form class="tc-form" @submit.prevent="scSend('person:'+p.id)">
    <textarea x-model="sc.text" rows="1" class="tc-in comp-input" :placeholder="'כתוב ל'+assistantName()+' על איש הקשר…'" :aria-label="'כתוב ל'+assistantName()+' על איש הקשר'" enterkeyhint="send" @input="autosize($event.target)"
      @keydown.enter="if(!$event.shiftKey && !$event.isComposing){ $event.preventDefault(); scSend('person:'+p.id); }"></textarea>
    <button type="submit" class="btn primary" :disabled="sc.sending || !sc.text.trim()">שליחה</button>
  </form>
</div>
                <h4>משימות (<span x-text="personCard.tasks.length"></span>)</h4>
                <template x-for="t in personCard.tasks" :key="'pt'+t.id"><button class="mini-row" @click="openTask(t.id)"><b x-text="t.title"></b><span class="muted" x-text="(t.role==='requester' ? 'מאת · ' : 'אחראי · ')+t.project+' · '+t.status"></span></button></template>
                <p class="muted" x-show="!personCard.tasks.length">אין משימות מקושרות</p>
                <h4>אזכורים (<span x-text="personCard.mentions.length"></span>)</h4>
                <template x-for="m in personCard.mentions" :key="'pm'+m.id"><div class="mention"><span class="muted" x-text="({task:'משימה',chat:'צ׳אט',note:'הערה',knowledge:'ידע',email:'מייל',protocol_item:'פרוטוקול'})[m.source_type]+' · '"></span><a href="#" x-show="m.task_id" @click.prevent="openTask(m.task_id)" x-text="m.text"></a><span x-show="!m.task_id" x-text="m.text"></span></div></template>
                <p class="muted" x-show="!personCard.mentions.length">אין אזכורים</p>
                <p class="stamps muted" x-show="personCard.stamps && personCard.stamps.created_at"><span x-text="'נוצר: '+fmtDateTime(personCard.stamps && personCard.stamps.created_at)"></span><br><span x-text="'עדכון אחרון: '+fmtDateTime(personCard.stamps.updated_at)"></span></p>
              </div>
            </template>
            <div class="muted" style="direction:ltr;text-align:right;font-size:.85rem;margin-top:2px;overflow-wrap:anywhere" x-show="p.emails.length" x-text="p.emails.join(', ')"></div>
            <div class="item-edit" x-show="editing==='u'+p.id">
              <label class="field"><span>שם בעברית</span><input type="text" x-model="form.name"></label>
              <label class="field"><span>שם לועזי (לזיהוי במיילים)</span><input type="text" x-model="form.name_en" style="direction:ltr;text-align:right"></label>
              <label class="field" x-show="p.role==='pm'||p.role==='contact'"><span>תפקיד</span>
                <select x-model="form.role"><option value="pm">מנהל פרויקט</option><option value="contact">איש קשר</option></select></label>
              <label class="field"><span>כתובות דוא״ל (מופרדות בפסיק)</span><input type="text" x-model="form.emails" style="direction:ltr;text-align:right"></label>
              <label class="field"><span>הערות</span><textarea x-model="form.notes" style="min-height:72px"></textarea></label>
              <div class="btnrow"><button class="btn primary" @click="savePerson(p)">שמירה</button></div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>
</template>

</main>

<div class="upload-panel" x-show="uploads.length" x-cloak aria-live="polite">
  <template x-for="u in uploads" :key="u.id">
    <div class="up-item" :class="{err: u.error}">
      <div class="up-top"><b x-text="u.name"></b><button class="up-x" x-show="u.done" @click="uploads = uploads.filter(x => x.id !== u.id)" aria-label="סגירה">✕</button></div>
      <div class="up-bar"><div class="up-fill" :style="'width:'+u.pct+'%'"></div></div>
      <div class="muted sm" x-text="u.text"></div>
    </div>
  </template>
</div>

<nav class="bottomnav" aria-label="ניווט ראשי">
  <button :class="{on: route.name==='home'||route.name==='task'}" @click="go('/')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h9"/></svg>ראשי</button>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>דואר</button>
  <button :class="{on: route.name==='projects'}" @click="go('/projects')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>פרויקטים</button>
  <button :class="{on: route.name==='calendar'}" @click="go('/calendar')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>יומן</button>

    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>עוד</button>
</nav>

  <div class="more-sheet" @click.stop>
    <button @click="moreOpen=false; go('/search')">חיפוש</button>
    <button @click="moreOpen=false; go('/protocols')">פרוטוקולים</button>
    <button @click="moreOpen=false; go('/archive')">📦 ארכיון</button>
    <button @click="moreOpen=false; go('/activity')">פעילות</button>

    <button @click="moreOpen=false; go('/settings')">הגדרות</button>
  </div>

<!-- ===== CHAT PANEL (permanent on wide screens, sheet on phones) ===== -->
<div class="chat-backdrop" x-show="chatOpen" x-transition.opacity @click="closeChat()"></div>
<button class="chat-bar" @click="chatBarClick()" aria-label="פתיחת הצ׳אט" title="פתיחת הצ׳אט">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
  <svg class="bar-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  <span class="bar-label">פתיחת הצ׳אט</span>
  <span class="badge" x-show="unread()>0" x-text="unread()"></span>
</button>
<button class="chat-pin" x-show="route.name==='home' && !chatOpen" @click="openChat(true)" aria-label="כתוב לי">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
  <span class="pin-text" x-text="searching() ? 'אלכס מחפש באינטרנט…' : busy() ? 'אלכס חושב…' : 'כתוב לי…'"></span>
  <span class="badge" x-show="unread()>0" x-text="unread()"></span>
</button>
<div class="divider divider-chat" data-pane="chat" role="separator" aria-orientation="vertical" aria-label="שינוי רוחב הצ׳אט" tabindex="0" title="גרירה לשינוי הרוחב, לחיצה כפולה לאיפוס"><span class="grip"><i></i><i></i><i></i></span></div>
<aside class="chat-panel" :class="{open: chatOpen, 'drop-active': dropping==='chat'}" aria-label="צ׳אט עם אלכס" @dragenter="dragOver('chat', $event)" @dragover="dragOver('chat', $event)" @dragleave="dragLeave('chat', $event)" @drop="dropOn('chat', $event)">
  <div class="drop-overlay" x-show="dropping==='chat'" x-cloak><span>שחרר כאן כדי לשלוח לאלכס</span></div>
  <div class="cp-head">

        <textarea rows="1" x-model="chatText" class="comp-input" placeholder="כתוב לי…" aria-label="כתוב לי" enterkeyhint="send" @paste="onPaste($event)"
          @input="autosize($event.target)" @keydown.enter="if(!$event.shiftKey && !$event.isComposing && window.matchMedia('(min-width: 900px)').matches){ $event.preventDefault(); sendChat(); }"></textarea>
        <button type="button" class="icon-btn" :class="{rec: listening}" @click="toggleMic()" aria-label="הקלטה קולית" title="הקלטה קולית"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button type="button" class="btn primary send" @click="sendChat()" x-bind:disabled="sending || uploading() || (!chatText.trim() && !chatFiles.some(f => f.done))">שליחה</button>
      </div>
    </div></div>
</aside>

<div class="picker-bg" x-show="purgeDlg" x-cloak @click.self="purgeDlg=null" @keydown.escape.window="purgeDlg=null">
  <div class="picker del-dlg" role="dialog" aria-modal="true" x-show="purgeDlg">
    <div class="pk-head"><b>מחיקה לצמיתות</b><button class="icon-btn" @click="purgeDlg=null" aria-label="סגירה">✕</button></div>
    <p x-text="purgeDlg ? '״'+purgeDlg.t.title+'״' : ''"></p>
    <p class="muted sm">המשימה, ההערות, הקישורים למיילים והשיחה עליה יימחקו לצמיתות (לא לארכיון). אפשר לבטל תוך 30 שניות.</p>
    <div class="btnrow"><button class="btn danger" @click="confirmPurge()">מחק לצמיתות</button><button class="btn" @click="purgeDlg=null">ביטול</button></div>
  </div>
</div>
<div class="purge-undo" x-show="purgeUndo && purgeLeft()>0" x-cloak><span x-text="'נמחקה לצמיתות: '+(purgeUndo ? clipText(purgeUndo.title, 40) : '')"></span><button class="btn small" @click="undoPurge(purgeUndo)" x-text="'בטל ('+purgeLeft()+')'"></button></div>

<div class="picker-bg" x-show="delDlg" x-cloak @click.self="delDlg=null" @keydown.escape.window="delDlg=null">
  <div class="picker del-dlg" role="dialog" aria-modal="true" x-show="delDlg">
    <div class="pk-head"><b>מחיקת הודעה</b><button class="icon-btn" @click="delDlg=null" aria-label="סגירה">✕</button></div>
    <p class="muted" x-text="delDlg ? clipText(delDlg.m.text, 120) : ''"></p>
    <template x-if="delDlg && delDlg.m && delDlg.m.author==='owner'"><label class="switch-row"><input type="checkbox" x-model="delDlg.undo"><span>בטל גם את מה שאלכס עשה בעקבות ההודעה</span></label></template>
    <div class="btnrow"><button class="btn danger" @click="confirmDelete()">מחק</button><button class="btn" @click="delDlg=null">ביטול</button></div>
  </div>
</div>

<div class="picker-bg" x-show="picker" x-transition.opacity @click.self="closePicker()" @keydown.escape.window="closePicker()">
  <div class="picker" role="dialog" aria-modal="true" :style="pickerStyle()">
    <div class="pk-head"><b x-text="picker ? picker.title : ''"></b><button class="icon-btn" @click="closePicker()" aria-label="סגירה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <template x-if="picker && (picker.type==='due' || picker.type==='received')">
      <div class="pk-date">
        <div class="pk-chips" x-show="picker.type==='due'">
          <button class="chip" @click="pickDate(offsetDate(0))">היום</button>
          <button class="chip" @click="pickDate(offsetDate(1))">מחר</button>
          <button class="chip" @click="pickDate(offsetDate(7))">בעוד שבוע</button>
          <button class="chip" x-show="detail && detail.due_date" @click="pickDate('')">ניקוי</button>
        </div>
        <input type="date" class="pk-input" x-model="picker.date" aria-label="תאריך">
        <input type="time" class="pk-input" x-model="picker.time" x-show="picker.type==='received'" aria-label="שעה">
        <button class="btn primary" @click="pickDate(picker.type==='received' ? picker.date+' '+(picker.time||'00:00') : picker.date)" :disabled="!picker.date">אישור</button>
      </div>
    </template>
    <template x-if="picker && picker.type==='fact'">
      <div class="pk-fact">
        <div class="pf-now"><b x-text="picker.fact.value + (picker.fact.unit ? ' ' + picker.fact.unit : '')"></b> <span class="muted" x-text="'נכון ל־' + dayOf(picker.fact.as_of_date)"></span></div>
        <div class="pf-hist">
          <template x-for="h in picker.history" :key="h.id">
            <div class="pf-row" :class="{cur: h.current}">
              <b x-text="h.value + (h.unit ? ' ' + h.unit : '')"></b>
              <span class="muted" x-text="dayOf(h.as_of_date) + (h.current ? ' · הנוכחי' : '')"></span>
              <button class="btn small ghost" x-show="h.source" @click="openFactSource(h)" x-text="factSourceLabel(h)"></button>
              <span class="muted" x-show="!h.source" x-text="factSourceLabel(h)"></span>
            </div>
          </template>
        </div>
        <div class="pf-edit">
          <input type="text" x-model="picker.value" placeholder="ערך חדש" aria-label="ערך">
          <input type="text" x-model="picker.unit" placeholder="יחידה (אופציונלי)" aria-label="יחידה">
          <input type="date" x-model="picker.date" class="pk-input" aria-label="נכון לתאריך">
          <button class="btn primary" @click="saveFact()" :disabled="!picker.value.trim() || !picker.date">עדכון הנתון</button>
        </div>
      </div>
    </template>
    <template x-if="picker && picker.type==='event'">
      <div class="pk-fact pf-edit">
        <input type="text" x-model="picker.key" placeholder="כותרת האירוע" aria-label="כותרת">
        <input type="date" x-model="picker.date" class="pk-input" aria-label="תאריך">
        <label class="switch-row"><input type="checkbox" x-model="picker.allday"><span>כל היום</span></label>
        <input type="time" x-model="picker.time" class="pk-input" x-show="!picker.allday" aria-label="שעה">
        <input type="text" x-model="picker.location" placeholder="מקום (אופציונלי)" aria-label="מקום">
        <button class="btn primary" @click="saveEvent()" :disabled="!picker.key.trim() || !picker.date">הוספה ליומן</button>
      </div>
    </template>
    <template x-if="picker && picker.type==='factnew'">
      <div class="pk-fact pf-edit">
        <input type="text" x-model="picker.key" placeholder="שם הנתון, למשל: סטטוס שלד" aria-label="שם הנתון">
        <input type="text" x-model="picker.value" placeholder="ערך" aria-label="ערך">
        <input type="text" x-model="picker.unit" placeholder="יחידה (אופציונלי)" aria-label="יחידה">
        <input type="date" x-model="picker.date" class="pk-input" aria-label="נכון לתאריך">
        <button class="btn primary" @click="saveFact()" :disabled="!picker.key.trim() || !picker.value.trim() || !picker.date">הוספה לכרטיס</button>
      </div>
    </template>
    <template x-if="picker && !(['due','received','fact','factnew','event'].includes(picker.type))">
      <div class="pk-list">
        <template x-for="o in pickerOptions()" :key="o.key">
          <button class="pk-opt" :class="{on: o.on}" @click="pickValue(o.value)"><i x-show="o.color" :style="'background:'+o.color"></i><span x-text="o.label"></span><span class="pk-sub" x-show="o.sub" x-text="o.sub"></span></button>
        </template>
      </div>
    </template>
  </div>
</div>

<div class="toast done-toast" x-show="doneUndo" x-cloak x-transition.opacity><span class="dt-msg">✔ הושלם</span> · <button type="button" class="dt-undo" @click="undoDoneNow()">ביטול</button></div>
<div class="toast" :class="{err: toastErr}" x-show="toastMsg" x-transition.opacity><span x-text="toastMsg"></span></div>

<!-- project settings: a real dialog on document.body level (fixed, centered, backdrop), never inside a pane -->
<div class="sheet-bg" x-show="menuOpen && pp" x-cloak x-transition.opacity @click.self="closeMenu()" @keydown.escape.window="menuOpen && closeMenu()" @keydown.tab="trapTab($event)">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pm-title" x-ref="pmenu" x-show="menuOpen && pp">
    <div class="sheet-head"><b id="pm-title">הגדרות פרויקט</b>
      <button type="button" class="icon-btn" @click="closeMenu()" aria-label="סגירה" title="סגירה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <template x-if="pp">
    <div class="sheet-body">
      <label class="field"><span>שם הפרויקט</span><input type="text" x-model="form.name" autocomplete="off"></label>
      <label class="field"><span>כינויים (מופרדים בפסיק)</span><input type="text" x-model="form.aliases" autocomplete="off"></label>
      <div class="field" x-show="!pp.project.is_default"><span>צבע</span>
        <div class="swatches"><template x-for="c in colors" :key="c"><button type="button" class="sw" :class="{on: form.color===c}" :style="'background:'+c" @click="form.color=c" aria-label="בחירת צבע"></button></template></div></div>
      <label class="field"><span>מצב הפרויקט</span><select x-model="form.status"><option>פעיל</option><option>מושהה</option><option>סגור</option></select></label>
      <div class="btnrow sheet-actions"><button class="btn primary" @click="saveProject(pp.project)">שמירה</button><button class="btn" type="button" @click="closeMenu()">ביטול</button></div>
      <div class="field sheet-merge" x-show="!pp.project.is_default"><span>מיזוג לתוך פרויקט אחר</span>
        <select x-model="mergeInto"><option value="">בחרו פרויקט יעד</option>
          <template x-for="o in boot.projects.filter(x=>x.id!==pp.project.id)" :key="o.id"><option :value="o.id" x-text="o.name_he"></option></template></select>
        <button class="btn danger" :disabled="!mergeInto" @click="mergeProject(pp.project)">מיזוג הפרויקט</button>
        <small class="muted">כל המשימות והמידע יעברו לפרויקט היעד, והשם הנוכחי יישמר ככינוי.</small></div>
    </div>
    </template>
  </div>
</div>

<div class="modal-bg" x-show="dlg" x-transition.opacity @keydown.escape.window="closeDlg(false)">
  <div class="modal" role="dialog" aria-modal="true" @click.outside="closeDlg(false)">
    <p x-text="dlg && dlg.msg"></p>
    <div class="btnrow"><button class="btn primary" @click="closeDlg(true)" x-text="dlg && dlg.ok"></button><button class="btn" @click="closeDlg(false)">ביטול</button></div>
  </div>
</div>
</body>
</html>
